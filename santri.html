<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TPQ BAITURRAHMAN</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;padding:10px}
.container{max-width:1000px;margin:auto;background:#fff;padding:18px;border-radius:8px}
.kop{display:flex;position:relative;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px;min-height:62px}
.kop img{position:absolute;left:0;top:0;width:60px;height:60px;border-radius:50%;background:#fff}
.kop-text{width:100%;text-align:center;line-height:1.25}
.kop-text h2{margin:0;font-size:19px}.kop-text p{margin:0;font-size:11px}.kop-text h3{margin:2px 0 0 0;font-size:14px}
table{width:100%;border-collapse:collapse;margin-top:10px} th,td{border:1px solid #000;padding:5px;text-align:center;font-size:11px} th{background:#e8f5e9}
input,select{padding:7px;width:100%;box-sizing:border-box;margin-bottom:5px;font-size:12px}
button{padding:8px 12px;margin:3px 2px;border:none;border-radius:4px;cursor:pointer;font-size:12px;color:#fff}
.btn-input{background:#0d6efd}.btn-cetak{background:#198754}.btn-edit{background:#ffc107;color:#000}.btn-hapus{background:#dc3545}.btn-hapusall{background:#6c757d}
@media print{.no-print{display:none} body{background:#fff}.container{padding:0}}
</style></head><body>
<div class="container">
<div class="kop">
<img src="logo.png">
<div class="kop-text">
<h2>TPQ BAITURRAHMAN</h2>
<p>Jl. Gadang 12 A RT.03 RW.05 Gadang - Sukun Malang 65149</p>
<h3>Data Santri TPQ</h3>
<p id="infoCetak" style="font-size:11px"></p>
</div>
</div>

<div class="no-print">
<div style="display:grid;grid-template-columns:1fr 120px 100px;gap:8px">
<input id="nama" placeholder="Nama Santri">
<select id="jk"><option value="">L / P</option><option value="L">L - Laki-laki</option><option value="P">P - Perempuan</option></select>
<input id="usia" placeholder="Usia">
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:5px">
<input id="wali" placeholder="Nama Wali Santri">
<input id="hp" placeholder="No.HP">
</div>
<div style="display:grid;grid-template-columns:1fr 160px;gap:8px;margin-top:5px">
<input id="alamat" placeholder="Alamat">
<input id="tgl" type="date">
</div>
<div style="margin-top:6px">
<button class="btn-input" id="btnSimpan" onclick="simpan()">+ Input Data</button>
<button class="btn-cetak" onclick="window.print()">Cetak / Simpan PDF</button>
<button class="btn-hapusall" onclick="hapusSemua()">Hapus Semua (PIN)</button>
</div>
</div>

<table><thead><tr><th>No</th><th>Nama</th><th>L / P</th><th>Usia</th><th>Wali Santri</th><th>No.HP</th><th>Alamat</th><th>Tgl Masuk</th><th class="no-print">Aksi</th></tr></thead><tbody id="tbody"></tbody></table>

<div style="display:flex;justify-content:space-between;margin-top:35px;font-size:12px;padding:0 10px"><div>Mengetahui,<br>Ketua TPQ<br><br><br>(.............)</div><div style="text-align:right"><p id="tglTTD"></p></div></div>
</div>

<script>
const PIN_BENAR = "1234"; // GANTI PIN DISINI PAK
let data=JSON.parse(localStorage.getItem('santri_baiturrahman')||'[]');
let editIndex = -1;

function cekPin(){
  let pin = prompt("Masukkan PIN Keamanan (default 1234):");
  if(pin===null) return false;
  if(pin===PIN_BENAR) return true;
  alert("PIN Salah!");
  return false;
}

function render(){
  let tb=document.getElementById('tbody');tb.innerHTML='';
  data.forEach((d,i)=>{
    tb.innerHTML+=`<tr><td>${i+1}</td><td>${d.nama}</td><td><b>${d.jk}</b></td><td>${d.usia}</td><td>${d.wali}</td><td>${d.hp}</td><td>${d.alamat}</td><td>${d.tgl}</td>
    <td class="no-print"><button class="btn-edit" onclick="editData(${i})">Edit</button> <button class="btn-hapus" onclick="hapusSatu(${i})">Hapus</button></td></tr>`;
  });
  let n=new Date();let l=data.filter(x=>x.jk=='L').length;let p=data.filter(x=>x.jk=='P').length;
  document.getElementById('infoCetak').innerText=`Tanggal Cetak: ${n.toLocaleDateString('id-ID')} | Total: ${data.length} Anak (L:${l} P:${p})`;
  document.getElementById('tglTTD').innerHTML=`Malang, ${n.toLocaleDateString('id-ID')}<br>Admin TPQ<br><br><br>(.............)`;
}

function simpan(){
  let a=nama.value,jk=document.getElementById('jk').value,b=usia.value,c=wali.value,d=hp.value,e=alamat.value,f=tgl.value;
  if(!a||!jk) return alert('Isi Nama & L/P!');
  if(editIndex>=0){
    if(!cekPin()) return;
    data[editIndex]={nama:a,jk:jk,usia:b,wali:c,hp:d,alamat:e,tgl:f};
    editIndex=-1;
    document.getElementById('btnSimpan').innerText='+ Input Data';
  } else {
    data.push({nama:a,jk:jk,usia:b,wali:c,hp:d,alamat:e,tgl:f});
  }
  localStorage.setItem('santri_baiturrahman',JSON.stringify(data));
  render(); clearForm();
}

function clearForm(){
  nama.value='';jk.value='';usia.value='';wali.value='';hp.value='';alamat.value='';tgl.value='';
}

function editData(i){
  let d=data[i];
  nama.value=d.nama;jk.value=d.jk;usia.value=d.usia;wali.value=d.wali;hp.value=d.hp;alamat.value=d.alamat;tgl.value=d.tgl;
  editIndex=i;
  document.getElementById('btnSimpan').innerText='Update Data (PIN)';
  window.scrollTo({top:0,behavior:'smooth'});
}

function hapusSatu(i){
  if(!cekPin()) return;
  if(confirm('Hapus data '+data[i].nama+'?')){
    data.splice(i,1);
    localStorage.setItem('santri_baiturrahman',JSON.stringify(data));
    render();
  }
}

function hapusSemua(){
  if(!cekPin()) return;
  if(confirm('HAPUS SEMUA DATA? Tidak bisa dikembalikan!')){
    if(confirm('Yakin Hapus Semua?')){
      data=[];
      localStorage.setItem('santri_baiturrahman',JSON.stringify(data));
      render();
    }
  }
}
render();
</script></body></html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - TPQ BAITURRAHMAN</title>
<style>
:root{ --bg:#f2f2f2; --card:#fff; --text:#111; --input:#fff; }
body.dark{ --bg:#0f0f0f; --card:#1e1e1e; --text:#eee; --input:#2a2a2a; }
body{font-family:Arial,sans-serif; background:var(--bg); color:var(--text); margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:15px; transition:0.3s;}
.card{max-width:360px; width:100%; background:var(--card); padding:25px 20px; border-radius:16px; box-shadow:0 6px 20px rgba(0,0,0,0.1); text-align:center; border-top:6px solid #2e7d32;}
.card img{width:85px; height:85px; border-radius:50%; border:3px solid #2e7d32; margin-bottom:10px; object-fit:cover;}
h2{margin:5px 0; font-size:20px;}.addr{font-size:11px; color:gray; margin-bottom:15px;}
input{width:100%; padding:13px; margin:7px 0; border:1.5px solid #aaa; border-radius:10px; box-sizing:border-box; font-size:15px; background:var(--input); color:var(--text);}
button.btn-login{width:100%; padding:13px; background:#2e7d32; color:#fff; border:none; border-radius:10px; font-weight:bold; cursor:pointer; font-size:16px; margin-top:12px;}
.btn-dark{position:fixed; top:10px; right:10px; z-index:999; padding:7px 12px; border-radius:20px; background:#222; color:#fff; border:none; font-size:11px; cursor:pointer;}
body.dark.btn-dark{background:#eee; color:#111;}
.err{color:#dc3545; font-size:12px; margin-top:8px; display:none; background:#ffe0e0; padding:6px; border-radius:6px;}
.info{font-size:11px; margin-top:15px; color:#555; background:#e8f5e9; padding:10px; border-radius:8px; text-align:left;}
</style>
</head>
<body>
<button id="btnDark" class="btn-dark" onclick="toggleDark()">🌙 Gelap</button>
<div class="card">
<img src="logo.png">
<h2>TPQ BAITURRAHMAN</h2>
<div class="addr">Jl. Gadang 12 A RT.03 RW.05 Gadang - Sukun Malang 65149</div>
<h3>🔒 Login Admin</h3>
<input id="user" placeholder="Username" value="admin">
<input id="pass" type="password" placeholder="Password (tpq123)">
<button class="btn-login" onclick="doLogin()">Masuk</button>
<div id="err" class="err">Password salah Pak!</div>
<div class="info"><b>Akun Default:</b><br>User: <b>admin</b> | Pass: <b>tpq123</b><br><small>Ganti di baris 38 Pak</small></div>
</div>
<script>
function toggleDark(){ document.body.classList.toggle('dark'); let d=document.body.classList.contains('dark'); localStorage.setItem('tpq_dark',''+d); document.getElementById('btnDark').innerText=d?'☀️ Terang':'🌙 Gelap'; }
if(localStorage.getItem('tpq_dark')=='true'){ document.body.classList.add('dark'); document.getElementById('btnDark').innerText='☀️ Terang'; }
if(localStorage.getItem('tpq_login')=='true') location.href='santri.html';
function doLogin(){
 let u=document.getElementById('user').value.trim(), p=document.getElementById('pass').value.trim();
 if(u==='admin' && p==='tpq123'){ localStorage.setItem('tpq_login','true'); location.href='santri.html'; }
 else{ let e=document.getElementById('err'); e.style.display='block'; setTimeout(()=>e.style.display='none',3000); }
}
document.getElementById('pass').addEventListener('keypress',e=>{ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>

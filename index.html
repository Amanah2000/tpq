<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keuangan TPQ</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f3f4f6;color:#111827;margin:0;padding:12px}
  .top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .top-bar-actions{display:flex;gap:6px;align-items:center}
  .top-bar button{width:auto;height:36px;padding:0 14px;border-radius:6px;border:1px solid #d1d5db;font-weight:600;cursor:pointer;background:#fff;color:#111827}
  .badge-status{font-size:12px;padding:8px 10px;border-radius:6px;background:#fff;color:#111827;border:1px solid #d1d5db}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:12px}
  .card{padding:14px;border-radius:12px;color:#fff;text-align:center;font-weight:700}
  .card span{display:block;font-size:14px;font-weight:500;opacity:.9}
  .card b{font-size:22px}
  .green{background:#16a34a}.red{background:#dc2626}.blue{background:#2563eb}
  .panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-bottom:12px}
  input,select{width:100%;height:42px;padding:0 12px;border-radius:8px;border:1px solid #d1d5db;box-sizing:border-box;background:#fff;color:#111827}
  .btn-main{width:100%;height:42px;border-radius:8px;border:0;font-weight:700;cursor:pointer;background:#16a34a;color:#fff;margin-top:4px}
  .btn-reset{width:100%;height:42px;border-radius:8px;border:0;font-weight:700;cursor:pointer;background:#9ca3af;color:#fff}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;margin-top:10px}
  th{background:#2563eb;color:#fff;padding:10px;text-align:left}
  td{padding:8px 10px;border-bottom:1px solid #e5e7eb}
  /* DARK MODE FINAL PAK - Light hitam Dark putih */
  body.dark{background:#0f172a;color:#ffffff}
  body.dark .panel, body.dark input, body.dark select, body.dark table, body.dark tr{background:#1e293b;color:#ffffff;border-color:#334155}
  body.dark td{border-color:#334155}
  body.dark th{background:#1e40af}
  body.dark .top-bar button{background:#1e293b;color:#fff;border-color:#334155}
  body.dark .badge-status{background:#1e293b;color:#fff;border-color:#334155}
</style>
</head>
<body>
<div class="top-bar">
  <h3 style="margin:0">Keuangan TPQ</h3>
  <div class="top-bar-actions">
    <button onclick="toggleDark()" id="btnDark">🌙 Dark</button>
    <button onclick="loadFromSheet()">🔄 Sinkron HP</button>
    <button onclick="logout()" style="background:#ef4444;color:#fff;border-color:#ef4444">Logout</button>
    <span id="status" class="badge-status">Siap</span>
  </div>
</div>
<div class="cards">
  <div class="card green"><span>TOTAL PEMASUKAN</span><b id="totalMasuk">Rp 0</b></div>
  <div class="card red"><span>TOTAL PENGELUARAN</span><b id="totalKeluar">Rp 0</b></div>
  <div class="card blue"><span>SALDO SAAT INI</span><b id="saldo">Rp 0</b></div>
</div>
<div class="panel">
  <div style="display:grid;grid-template-columns:1.2fr .8fr 2fr auto;gap:8px">
    <input type="date" id="tgl"><input type="time" id="jam"><input type="text" id="ket" placeholder="Keterangan"><button class="btn-main" onclick="tambah()">+ Tambah & Sinkron</button>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
    <input type="number" id="masuk" placeholder="Masuk (Rp)"><input type="number" id="keluar" placeholder="Keluar (Rp)">
  </div>
  <div style="display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px;margin-top:12px">
    <input type="text" id="cari" placeholder="🔍 Cari..." oninput="render()"><select id="filterBulan" onchange="render()"><option value="">Semua Bulan</option><option value="9">September</option></select><select id="filterTahun" onchange="render()"><option value="">Semua Tahun</option><option value="2026">2026</option></select><button class="btn-reset" onclick="resetFilter()">Reset Filter</button>
  </div>
  <div id="infoFilter" style="font-size:12px;margin-top:8px;font-weight:600"></div>
  <table><thead><tr><th>Tgl</th><th>Jam</th><th>Ket</th><th>Masuk</th><th>Keluar</th><th>Saldo</th><th>Aksi</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
<script>
let data=JSON.parse(localStorage.getItem("tpqData")||"[]");
function toggleDark(){document.body.classList.toggle("dark");let d=document.body.classList.contains("dark");localStorage.setItem("darkTPQ",d?"1":"0");document.getElementById("btnDark").innerText=d?"☀️ Light":"🌙 Dark";}
if(localStorage.getItem("darkTPQ")==="1"){document.body.classList.add("dark");document.getElementById("btnDark").innerText="☀️ Light";}
function formatRp(n){return "Rp "+(n||0).toLocaleString("id-ID");}
function tambah(){let tgl=document.getElementById("tgl").value;let jam=document.getElementById("jam").value;let ket=document.getElementById("ket").value;let masuk=parseInt(document.getElementById("masuk").value||0);let keluar=parseInt(document.getElementById("keluar").value||0);if(!tgl||!ket){alert("Isi tanggal & keterangan Pak!");return;}data.push({tgl,jam,ket,masuk,keluar});localStorage.setItem("tpqData",JSON.stringify(data));render();}
function hapus(i){data.splice(i,1);localStorage.setItem("tpqData",JSON.stringify(data));render();}
function resetFilter(){document.getElementById("cari").value="";render();}
function render(){let tbody=document.getElementById("tbody");tbody.innerHTML="";let saldo=0,totalM=0,totalK=0;data.forEach((d,i)=>{saldo+=d.masuk-d.keluar;totalM+=d.masuk;totalK+=d.keluar;tbody.innerHTML+=`<tr><td>${d.tgl}</td><td>${d.jam}</td><td>${d.ket}</td><td>${d.masuk?formatRp(d.masuk):""}</td><td>${d.keluar?formatRp(d.keluar):""}</td><td>${formatRp(saldo)}</td><td><button onclick="hapus(${i})" style="background:#ef4444;color:#fff;border:0;border-radius:6px;padding:4px 8px">Hapus</button></td></tr>`});document.getElementById("totalMasuk").innerText=formatRp(totalM);document.getElementById("totalKeluar").innerText=formatRp(totalK);document.getElementById("saldo").innerText=formatRp(totalM-totalK);document.getElementById("infoFilter").innerText=`Menampilkan ${data.length} dari ${data.length} data | Masuk: ${formatRp(totalM)} | Keluar: ${formatRp(totalK)}`;}
render();
function loadFromSheet(){alert("Sinkron HP - isi URL Sheet Bapak");} function logout(){alert("Logout");}
</script>
</body>
</html>

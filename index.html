<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login TPQ BAITURRAHMAN</title>
<style>
body{font-family:Arial; background:#e8f5e9; margin:0; display:flex; justify-content:center; align-items:center; min-height:100vh;}
.card{background:#fff; padding:24px; border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.15); width:90%; max-width:340px; text-align:center;}
.card img{width:80px; height:80px; border-radius:50%; border:3px solid #2e7d32; margin-bottom:10px;}
input{width:100%; padding:12px; margin:8px 0; border:1.5px solid #000; border-radius:8px; box-sizing:border-box;}
button{width:100%; padding:12px; background:#2e7d32; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;}
.err{color:red; font-size:12px; margin-top:8px; display:none;}
</style>
</head>
<body>
<div class="card">
<img src="logo.png" onerror="this.src='https://via.placeholder.com/80'">
<h3>TPQ BAITURRAHMAN</h3>
<p style="font-size:12px;">Login Admin Pak</p>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="doLogin()">🔐 Login</button>
<div id="err" class="err">Username / Password salah Pak!</div>
<p style="font-size:10px; color:#888; margin-top:12px;">Default: admin / amanah2000</p>
</div>
<script>
if(localStorage.getItem('tpq_login')==='true'){ location.href='dashboard.html'; }
function doLogin(){
  let u=document.getElementById('user').value.trim();
  let p=document.getElementById('pass').value.trim();
  let USERNAME='admin'; let PASSWORD='1234';
  if(u===USERNAME && p===PASSWORD){
    localStorage.setItem('tpq_login','true');
    location.href='dashboard.html';
  } else {
    document.getElementById('err').style.display='block';
  }
}
document.getElementById('pass').addEventListener('keypress', function(e){ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><style>color:#fff;</style>Kas TPQ v7.5.9</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui;background:#f1f5f9;margin:0;padding:10px}
.card{background:white;border-radius:16px;padding:14px;max-width:950px;margin:0 auto;box-shadow:0 4px 20px rgba(0,0,0,.06)}
h2{text-align:center;color:#2563eb;margin:4px 0 10px 0}
.form{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.form input{flex:1;min-width:110px;padding:11px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;color:#000;font-weight:600;font-size:13px}
.btn{padding:10px 12px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:12px}
.btn-primary{background:#2563eb;color:#fff;flex:1}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
th{background:#2563eb;color:white;padding:10px 4px;font-size:11px}td{padding:8px 4px;border-bottom:1px solid #e2e8f0;text-align:center;font-size:12px;background:white}
#pinModal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:9999;padding:12px}
#pinModal.show{display:flex!important}.pinBox{background:white;width:100%;max-width:360px;padding:20px;border-radius:18px;text-align:center}
#pinInput{width:100%;background:#fff!important;color:#000!important;border:2.5px solid #2563eb!important;border-radius:12px;padding:14px;text-align:center;font-size:18px;font-weight:700;letter-spacing:4px}
</style>
</head>
<body>
<div class="card">
<h2>Kas TPQ v7.5.9</h2>
<div class="form">
<input id="tgl" type="date"><input id="ket" type="text" placeholder="Keterangan"><input id="masuk" type="number" placeholder="Masuk"><input id="keluar" type="number" placeholder="Keluar">
<button class="btn btn-primary" onclick="tambah()">+ Tambah</button>
</div>
<div class="toolbar">
<button class="btn" style="background:#0ea5e9;color:white" onclick="mintaPin('excel')">📊 Excel</button>
<button class="btn" style="background:#8b5cf6;color:white" onclick="mintaPin('cetak')">🖨️ Cetak PDF</button>
<button class="btn" style="background:#10b981;color:white" onclick="mintaPin('rekap')">📈 Rekap</button>
<button class="btn" style="background:#ef4444;color:white" onclick="mintaPin('hapus')">🗑️ Hapus Semua</button>
</div>
<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>Tgl</th><th>Jam</th><th>Ket</th><th>Masuk</th><th>Keluar</th><th>Saldo</th><th>Aksi</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div style="text-align:center;font-size:11px;margin-top:8px;color:#64748b">v7.5.9 - Cetak Rapi PDF - Anti Hilang</div>
</div>

<div id="pinModal"><div class="pinBox"><h3 id="pinTitle">🔒 Masukkan PIN</h3><p id="pinKet" style="font-size:13px;color:#475569"></p><input type="password" id="pinInput" placeholder="112233" inputmode="numeric"><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="flex:1;background:#6b7280;color:white" onclick="tutupPin()">Batal</button><button class="btn" style="flex:1;background:#2563eb;color:white" onclick="konfirmasiPin()">Buka</button></div><div id="pinMsg" style="font-size:12px;min-height:18px;margin-top:8px;font-weight:700"></div><div id="hapusSatuWrap" style="display:none;margin-top:12px"><button onclick="hapusSatu()" style="width:100%;background:#fef2f2;border:1.5px dashed #fecaca;color:#dc2626;padding:10px;border-radius:10px;font-size:12px;font-weight:700">🗑️ Hapus data ini</button></div></div></div>

<script>
let data=JSON.parse(localStorage.getItem('tpq_v759')||localStorage.getItem('tpq_v758')||localStorage.getItem('tpq_v757')||localStorage.getItem('tpq_v756')||'[]');
let aksi=""; let editIndex=-1;
document.getElementById('tgl').valueAsDate=new Date();
function simpan(){localStorage.setItem('tpq_v759',JSON.stringify(data));}
function render(){
let saldo=0; const tb=document.getElementById('tbody'); tb.innerHTML='';
if(data.length===0) tb.innerHTML='<tr><td colspan=7 style="color:#94a3b8;padding:20px">Belum ada data Pak</td></tr>';
data.forEach((d,i)=>{saldo+=(Number(d.masuk)||0)-(Number(d.keluar)||0);
tb.innerHTML+=`<tr><td>${d.tgl}</td><td>${d.jam}</td><td style="text-align:left">${d.ket}</td><td style="text-align:right;font-weight:700">Rp ${Number(d.masuk||0).toLocaleString('id-ID')}</td><td style="text-align:right;color:#dc2626">Rp ${Number(d.keluar||0).toLocaleString('id-ID')}</td><td style="text-align:right;font-weight:800;color:#2563eb">Rp ${saldo.toLocaleString('id-ID')}</td><td><button onclick="mintaPin('edit',${i})" style="padding:6px 10px;border:none;background:#f59e0b;color:white;border-radius:8px">Edit</button></td></tr>`;
}); simpan();
}
function tambah(){const tgl=document.getElementById('tgl').value, ket=document.getElementById('ket').value, masuk=document.getElementById('masuk').value, keluar=document.getElementById('keluar').value; if(!ket) return alert('Isi keterangan Pak!'); const jam=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); data.push({tgl,jam,ket,masuk:masuk||0,keluar:keluar||0}); render(); document.getElementById('ket').value=''; document.getElementById('masuk').value=''; document.getElementById('keluar').value='';}
function mintaPin(jenis,i=-1){aksi=jenis; editIndex=i; document.getElementById('pinInput').value=''; document.getElementById('pinMsg').innerText=''; document.getElementById('hapusSatuWrap').style.display=(jenis==='edit'?'block':'none');
if(jenis==='edit'){document.getElementById('pinTitle').innerText='✏️ Edit / Hapus?'; document.getElementById('pinKet').innerText=data[i].ket;}
else if(jenis==='excel'){document.getElementById('pinTitle').innerText='📊 Download Excel?'; document.getElementById('pinKet').innerText='Masukkan PIN untuk download Excel Pak';}
else if(jenis==='cetak'){document.getElementById('pinTitle').innerText='🖨️ Cetak PDF?'; document.getElementById('pinKet').innerText='Cetak rapi hanya data Pak, bukan halaman web Pak';}
else if(jenis==='hapus'){document.getElementById('pinTitle').innerText='🗑️ Hapus Semua?'; document.getElementById('pinKet').innerText='Bahaya Pak! PIN untuk hapus semua';}
else if(jenis==='rekap'){document.getElementById('pinTitle').innerText='📈 Rekap?'; document.getElementById('pinKet').innerText='Masukkan PIN untuk rekap Pak';}
document.getElementById('pinModal').classList.add('show');
}
function tutupPin(){document.getElementById('pinModal').classList.remove('show');}
function konfirmasiPin(){
const pin=document.getElementById('pinInput').value; const msg=document.getElementById('pinMsg');
if(pin!=='112233'){msg.style.color='#dc2626'; msg.innerText='❌ Salah Pak, PIN 112233'; document.getElementById('pinInput').value=''; return;}
tutupPin();
if(aksi==='edit'){ const k=prompt('Edit Keterangan Pak:',data[editIndex].ket); if(k===null) return; const m=prompt('Edit Masuk Pak:',data[editIndex].masuk); const kl=prompt('Edit Keluar Pak:',data[editIndex].keluar); if(k) data[editIndex].ket=k; data[editIndex].masuk=m||0; data[editIndex].keluar=kl||0; render();}
else if(aksi==='excel'){ let csv="Tgl,Jam,Ket,Masuk,Keluar,Saldo\n"; let s=0; data.forEach(d=>{s+=(Number(d.masuk)||0)-(Number(d.keluar)||0); csv+=`${d.tgl},${d.jam},"${d.ket}",${d.masuk},${d.keluar},${s}\n`;}); const b=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='Kas_TPQ.csv'; a.click();}
else if(aksi==='cetak'){ cetakRapi(); }
else if(aksi==='hapus'){ if(confirm('Yakin Pak hapus semua data Pak?')){data=[]; render();} }
else if(aksi==='rekap'){ let m=0,k=0; data.forEach(d=>{m+=Number(d.masuk)||0; k+=Number(d.keluar)||0}); alert(`Rekap Pak:\nMasuk: Rp ${m.toLocaleString('id-ID')}\nKeluar: Rp ${k.toLocaleString('id-ID')}\nSaldo: Rp ${(m-k).toLocaleString('id-ID')}`);}
}
function hapusSatu(){if(confirm('Hapus '+data[editIndex].ket+' Pak?')){data.splice(editIndex,1); tutupPin(); render();}}
function cetakRapi(){
  let m=0,k=0; data.forEach(d=>{m+=Number(d.masuk)||0; k+=Number(d.keluar)||0}); let s=0;
  let rows=''; data.forEach(d=>{s+=(Number(d.masuk)||0)-(Number(d.keluar)||0); 
  rows+=`<tr>
  <td style="text-align:center">${d.tgl}</td>
  <td style="text-align:center">${d.jam}</td>
  <td style="text-align:center">${d.ket}</td>
  <td style="text-align:center">${Number(d.masuk||0).toLocaleString('id-ID')}</td>
  <td style="text-align:center">${Number(d.keluar||0).toLocaleString('id-ID')}</td>
  <td style="text-align:center;font-weight:bold">${s.toLocaleString('id-ID')}</td>
  </tr>`});
  const win=window.open('','_blank');
  win.document.write(`<html><head><title>Kas TPQ</title><style>
  body{font-family:system-ui;padding:24px}h2{text-align:center}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th,td{border:1px solid #999;padding:8px 6px;font-size:12px;text-align:center}
  th{background:#eee;text-align:center}
  .total{margin-top:12px;font-size:13px;font-weight:700;text-align:center}
  .ttd-wrap{display:flex; justify-content:center; gap:140px; margin-top:50px; text-align:center}
  .ttd-box{width:230px; text-align:center; line-height:1.6}
  @media print{button{display:none}}</style></head><body>
  <h2>Laporan Kas TPQ</h2><div style="text-align:center;font-size:12px">Tanggal Cetak: ${new Date().toLocaleString('id-ID')}</div>
  <table><thead><tr><th>Tgl</th><th>Jam</th><th>Ket</th><th>Masuk</th><th>Keluar</th><th>Saldo</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="total">Total Masuk: Rp ${m.toLocaleString('id-ID')} | Total Keluar: Rp ${k.toLocaleString('id-ID')} | Sisa Saldo: Rp ${(m-k).toLocaleString('id-ID')}</div>
  <div class="ttd-wrap">
    <div class="ttd-box">Mengetahui,<br>Ketua TPQ<br><br><br><br><br>(...................)</div>
    <div class="ttd-box">Malang, ${new Date().toLocaleDateString('id-ID')}<br>Bendahara TPQ<br><br><br><br><br>(...................)</div>
  </div>
  <br><div style="text-align:center"><button onclick="window.print()" style="padding:10px 20px;background:#2563eb;color:white;border:none;border-radius:8px">Cetak / Simpan PDF</button></div>
  </body></html>`); win.document.close();
}


render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPQ Kas v7.5.3</title>
<style>
    * { box-sizing: border-box !important; }
  body { font-family: sans-serif; background: #f8fafc; margin:0; padding:12px; }
  table { width:100%; border-collapse:collapse; background:white; border-radius:12px; overflow:hidden; margin:0 auto; }
  th, td { padding:10px 8px; border:1px solid #e2e8f0; text-align:center; font-size:13px; word-break:break-word; }
  th { background:#2563eb; color:white; }
  /* FIX MODAL PIN - ANTI PINDAH PINGGIR */
  #pinModal {
    position: fixed !important;
    inset: 0 !important;
    background: rgba(0,0,0,0.5) !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    z-index: 9999 !important;
  }
  .pinBox {
    background: white !important;
    width: 90% !important;
    max-width: 360px !important;
    padding: 24px !important;
    border-radius: 18px !important;
    margin: auto !important;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3) !important;
  }
  #pinInput {
    width: 100% !important;
    background: #ffffff !important;
    color: #000000 !important;
    border: 2.5px solid #2563eb !important;
    border-radius: 12px !important;
    padding: 14px 16px !important;
    text-align: left !important;
    font-size: 16px !important;
    font-weight: 700 !important;
    outline: none !important;
  }
  #pinInput::placeholder { color:#94a3b8 !important; }
  #pinInput:focus { border-color:#f59e0b !important; box-shadow:0 0 0 3px rgba(245,158,11,0.2) !important; }
  .btn { cursor:pointer; font-weight:700; }
</style>
</head>
<body>

<div id="app">
  <h2 style="text-align:center; color:#2563eb;">Kas TPQ v7.5.3</h2>
  <table>
    <tr><th>Tgl</th><th>Jam</th><th>Ket</th><th>Masuk</th><th>Keluar</th><th>Saldo</th><th>Aksi</th></tr>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- MODAL PIN EDIT - VERSI FIX TENGAH -->
<div id="pinModal" style="display:none;">
  <div class="pinBox">
    <div style="font-size:30px;">✏️🔒</div>
    <h3 style="margin:8px 0; color:#2563eb;">PIN Edit?</h3>
    <p style="font-size:12px;">Edit data <b id="pinKet"></b>?</p>
    <input type="password" id="pinInput" placeholder="Ketik PIN 112233" autocomplete="off" inputmode="numeric">
    <div style="display:flex; gap:8px; margin-top:12px;">
      <button class="btn" style="flex:1; background:#6b7280; color:#fff; padding:12px; border:none; border-radius:10px;" onclick="tutupPin()">Batal</button>
      <button class="btn" style="flex:1; background:#2563eb; color:#fff; padding:12px; border:none; border-radius:10px;" onclick="konfirmasiPin()">Buka</button>
    </div>
    <div id="pinMsg" style="font-size:11px; color:#dc2626; margin-top:8px; min-height:16px; text-align:center;"></div>
    <div style="margin-top:10px;">
      <button class="btn" style="width:100%; background:#fef2f2; color:#dc2626; border:1px dashed #fecaca; padding:10px; border-radius:10px; font-size:12px;" onclick="hapusData()">🗑️ Hapus data ini</button>
    </div>
  </div>
</div>

<script>
// LOGIC PIN 112233
function bukaPin(ket){
  document.getElementById('pinKet').innerText = ket || 'Rp 40.000';
  document.getElementById('pinModal').style.display = 'flex';
  document.getElementById('pinInput').value = '';
  document.getElementById('pinInput').focus();
}
function tutupPin(){ document.getElementById('pinModal').style.display = 'none'; }
function konfirmasiPin(){
  const pin = document.getElementById('pinInput').value;
  if(pin === '112233'){
    document.getElementById('pinMsg').style.color = 'green';
    document.getElementById('pinMsg').innerText = '✅ PIN benar Pak!';
    // lanjut edit...
    setTimeout(tutupPin, 500);
  } else {
    document.getElementById('pinMsg').style.color = '#dc2626';
    document.getElementById('pinMsg').innerText = '❌ PIN salah Pak, harus 112233 Pak!';
  }
}
// DETEKSI INTERNET
window.addEventListener('offline', () => {
  document.getElementById('pinMsg').innerText = '⚠️ Internet putus Pak, data simpan lokal dulu Pak!';
});
window.addEventListener('online', () => {
  document.getElementById('pinMsg').innerText = '✅ Internet nyambung lagi Pak!';
});
</script>
</body>
</html>

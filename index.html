<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Kas TPQ Garis Kecil</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        font-family: Arial;
        padding: 12px;
        background: #f5f5f5;
      }
      .container {
        max-width: 1100px;
        margin: auto;
        background: white;
        padding: 15px;
        border-radius: 10px;
      }
      .kop {
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 2px solid #1e3a8a;
        padding-bottom: 10px;
      }
      .kop img {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        object-fit: cover;
      }
      .form-top {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        background: #eef2ff;
        padding: 10px;
        border-radius: 8px;
        margin-top: 10px;
      }
      .form-top input,
      .form-top select {
        padding: 7px;
        border: 1px solid #ccc;
        border-radius: 5px;
        flex: 1;
        min-width: 80px;
        font-size: 13px;
      }
      .input-cari {
        width: 100%;
        padding: 9px !important;
        border: 1.5px solid #f59e0b !important;
        background: #fffbeb;
        border-radius: 6px !important;
        margin-top: 8px;
      }
      .btn {
        padding: 7px 12px;
        border: none;
        border-radius: 5px;
        color: white;
        cursor: pointer;
        font-size: 13px;
      }
      .btn-tambah {
        background: #16a34a;
      }
      .btn-cetak {
        background: #2563eb;
      }
      .btn-edit {
        background: #f59e0b;
        padding: 3px 6px;
        font-size: 10px;
      }
      .btn-hapus {
        background: #ef4444;
        padding: 3px 6px;
        font-size: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th,
      td {
        border: 1px solid #bbb;
        padding: 6px;
        text-align: center !important;
        font-size: 12px;
      }
      th {
        background: #1e3a8a;
        color: white;
      }
      .chart-box {
        margin: 10px 0;
        padding: 8px;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
      }
      .chart-box canvas {
        max-height: 220px !important;
      }
      .ttd {
        display: none;
      }
      @media print {
        .form-top,
        .input-cari,
        .no-print {
          display: none !important;
        }
        .ttd {
          display: block;
          text-align: right;
          margin-top: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="kop">
        <img id="logoTPQ" src="https://via.placeholder.com/55?text=TPQ" />
        <div><b>TPQ BAITURRAHMAN</b><br /><small>Laporan Kas Harian</small></div>
        <input
          type="file"
          id="upLogo"
          class="no-print"
          style="margin-left: auto; font-size: 10px"
          accept="image/*"
        />
      </div>
      <div class="form-top">
        <input type="date" id="tanggal" /><input
          type="text"
          id="ket"
          placeholder="Keterangan"
        /><input type="number" id="masuk" placeholder="Masuk" /><input
          type="number"
          id="keluar"
          placeholder="Keluar"
        /><select id="filterBulan">
          <option value="all">Semua Bulan</option>
          <option value="0">Jan</option>
          <option value="1">Feb</option>
          <option value="2">Mar</option>
          <option value="3">Apr</option>
          <option value="4">Mei</option>
          <option value="5">Jun</option>
          <option value="6">Jul</option>
          <option value="7">Agu</option>
          <option value="8">Sep</option>
          <option value="9">Okt</option>
          <option value="10">Nov</option>
          <option value="11">Des</option></select
        ><button class="btn btn-tambah" onclick="tambahData()">+ Tambah</button
        ><button class="btn btn-cetak" onclick="window.print()">Cetak</button>
      </div>
      <input
        type="text"
        id="inputCari"
        class="input-cari"
        placeholder="🔍 KETIK UNTUK CARI - misal: Amal, Bisyaroh, Marbot..."
      />
      <div class="chart-box"><canvas id="kasChart" height="90"></canvas></div>
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Tanggal</th>
            <th>Keterangan</th>
            <th>Masuk</th>
            <th>Keluar</th>
            <th>Saldo</th>
            <th class="no-print">Aksi</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
        <tfoot>
          <tr style="background: #dbeafe; font-weight: bold">
            <td colspan="3">Total Saldo Akhir</td>
            <td id="tm"></td>
            <td id="tk"></td>
            <td id="ts" colspan="2"></td>
          </tr>
        </tfoot>
      </table>
      <div class="ttd">
        <p>Malang, <span id="tglC"></span><br />Bendahara,<br /><br /><br />(__________)</p>
      </div>
    </div>
    <script>
      let dataKas = JSON.parse(localStorage.getItem("kasFINAL")) || [
        { tanggal: "2026-10-15", keterangan: "Amal Santri", masuk: 1080000, keluar: 0 },
        { tanggal: "2026-10-15", keterangan: "Kas Khataman", masuk: 130000, keluar: 0 },
        { tanggal: "2026-10-15", keterangan: "B. Masputo", masuk: 60000, keluar: 0 },
        { tanggal: "2026-10-15", keterangan: "Kas Mushola/Marbot", masuk: 70000, keluar: 0 },
        { tanggal: "2026-10-15", keterangan: "Bisyaroh 6 Guru", masuk: 0, keluar: 1060000 },
        { tanggal: "2026-10-15", keterangan: "honor Marbot", masuk: 0, keluar: 70000 },
      ];
      let editIndex = -1,
        myChart = null;
      function fmt(t) {
        const d = new Date(t);
        return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
      }
      function renderTabel() {
        const keyword = document.getElementById("inputCari").value.toLowerCase();
        const bulanFilter = document.getElementById("filterBulan").value;
        const tbody = document.getElementById("tbody");
        tbody.innerHTML = "";
        let saldo = 0,
          totalM = 0,
          totalK = 0,
          labels = [],
          arrM = [],
          arrK = [],
          arrS = [];
        let no = 1;
        dataKas.forEach((it, i) => {
          const b = new Date(it.tanggal).getMonth();
          if (bulanFilter !== "all" && b != parseInt(bulanFilter)) return;
          if (keyword && !it.keterangan.toLowerCase().includes(keyword)) return;
          saldo += (parseInt(it.masuk) || 0) - (parseInt(it.keluar) || 0);
          totalM += parseInt(it.masuk) || 0;
          totalK += parseInt(it.keluar) || 0;
          labels.push(no + ". " + it.keterangan);
          arrM.push(parseInt(it.masuk) || 0);
          arrK.push(parseInt(it.keluar) || 0);
          arrS.push(saldo);
          tbody.innerHTML += `<tr><td>${no}</td><td>${fmt(it.tanggal)}</td><td>${it.keterangan}</td><td style="color:green">Rp ${Number(it.masuk).toLocaleString("id-ID")}</td><td style="color:red">Rp ${Number(it.keluar).toLocaleString("id-ID")}</td><td><b>Rp ${saldo.toLocaleString("id-ID")}</b></td><td class="no-print"><button class="btn btn-edit" onclick="editData(${i})">Edit</button> <button class="btn btn-hapus" onclick="hapusData(${i})">Hapus</button></td></tr>`;
          no++;
        });
        document.getElementById("tm").innerText = "Rp " + totalM.toLocaleString("id-ID");
        document.getElementById("tk").innerText = "Rp " + totalK.toLocaleString("id-ID");
        document.getElementById("ts").innerText = "Rp " + saldo.toLocaleString("id-ID");
        document.getElementById("tglC").innerText = new Date().toLocaleDateString("id-ID");
        if (myChart) myChart.destroy();
        myChart = new Chart(document.getElementById("kasChart"), {
          type: "line",
          data: {
            labels: labels,
            datasets: [
              {
                label: "Masuk (Hijau)",
                data: arrM,
                borderColor: "#16a34a",
                borderWidth: 1,
                pointRadius: 2,
                tension: 0.3,
              },
              {
                label: "Keluar (Merah)",
                data: arrK,
                borderColor: "#ef4444",
                borderWidth: 1,
                pointRadius: 2,
                tension: 0.3,
              },
              {
                label: "Saldo (Biru)",
                data: arrS,
                borderColor: "#2563eb",
                backgroundColor: "rgba(37,99,235,0.06)",
                borderWidth: 1.2,
                pointRadius: 2.5,
                fill: true,
                tension: 0.3,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10 } } },
            },
            scales: {
              y: { beginAtZero: true, ticks: { font: { size: 10 } } },
              x: { ticks: { font: { size: 10 }, maxRotation: 30 } },
            },
          },
        });
        localStorage.setItem("kasFINAL", JSON.stringify(dataKas));
      }
      function tambahData() {
        const t = document.getElementById("tanggal").value,
          k = document.getElementById("ket").value,
          m = document.getElementById("masuk").value || 0,
          kl = document.getElementById("keluar").value || 0;
        if (!t || !k) {
          alert("Isi tanggal & keterangan");
          return;
        }
        if (editIndex >= 0) {
          dataKas[editIndex] = { tanggal: t, keterangan: k, masuk: m, keluar: kl };
          editIndex = -1;
        } else dataKas.push({ tanggal: t, keterangan: k, masuk: m, keluar: kl });
        document.getElementById("tanggal").value = "";
        document.getElementById("ket").value = "";
        document.getElementById("masuk").value = "";
        document.getElementById("keluar").value = "";
        renderTabel();
      }
      function editData(i) {
        const it = dataKas[i];
        document.getElementById("tanggal").value = it.tanggal;
        document.getElementById("ket").value = it.keterangan;
        document.getElementById("masuk").value = it.masuk;
        document.getElementById("keluar").value = it.keluar;
        editIndex = i;
      }
      function hapusData(i) {
        if (confirm("Hapus?")) {
          dataKas.splice(i, 1);
          renderTabel();
        }
      }
      document.getElementById("inputCari").addEventListener("input", renderTabel);
      document.getElementById("filterBulan").addEventListener("change", renderTabel);
      document.getElementById("upLogo").addEventListener("change", (e) => {
        const r = new FileReader();
        r.onload = () => (document.getElementById("logoTPQ").src = r.result);
        r.readAsDataURL(e.target.files[0]);
      });
      renderTabel();
    </script>
  </body>
</html>

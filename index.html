<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TPQ v7.0 Hapus PIN</title>
    <style>
      :root {
        --bg: #f3f4f6;
        --card: #fff;
        --text: #111;
        --bd: #e5e7eb;
      }
      body.dark {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f1f5f9;
        --bd: #334155;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui;
        margin: 0;
        padding: 10px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        flex-wrap: wrap;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 12px 0;
      }
      .card {
        padding: 14px;
        border-radius: 12px;
        color: #fff;
        text-align: center;
      }
      .card b {
        display: block;
        font-size: 18px;
      }
      .g {
        background: #16a34a;
      }
      .r {
        background: #dc2626;
      }
      .b {
        background: #2563eb;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 12px;
      }
      input,
      select {
        height: 44px;
        width: 100%;
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 0 12px;
        background: var(--card);
        color: var(--text);
      }
      .btn {
        height: 44px;
        border: 0;
        border-radius: 8px;
        padding: 0 12px;
        font-weight: 700;
        cursor: pointer;
        font-size: 13px;
      }
      #loginPage {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .loginBox {
        background: var(--card);
        border: 1px solid var(--bd);
        padding: 24px;
        border-radius: 16px;
        width: 100%;
        max-width: 360px;
        text-align: center;
      }
      #pinModal {
        position: fixed;
        inset: 0;
        z-index: 10000;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .pinBox {
        background: var(--card);
        padding: 20px;
        border-radius: 12px;
        width: 100%;
        max-width: 300px;
        text-align: center;
        border: 2px solid #dc2626;
      }
      .tbl {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }
      .tbl th {
        background: #2563eb;
        color: #fff;
        padding: 8px;
        font-size: 11px;
      }
      .tbl td {
        padding: 6px;
        border-bottom: 1px solid var(--bd);
        font-size: 11px;
      }
      .filterRow {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr auto;
        gap: 8px;
        margin-top: 10px;
      }
      .inputRow {
        display: grid;
        grid-template-columns: 1.1fr.8fr 1.6fr auto;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div id="loginPage">
      <div class="loginBox">
        <h2>Login TPQ Baiturrahman</h2>
        <input type="password" id="pass" placeholder="Password" style="text-align: center" /><button
          class="btn"
          style="width: 100%; margin-top: 10px; background: #2563eb; color: #fff"
          onclick="doLogin()"
        >
          Masuk
        </button>
        <div id="loginMsg" style="font-size: 12px; color: #dc2626; margin-top: 8px"></div>
        <div style="font-size: 10px; color: #888; margin-top: 8px">v7.0 Hapus pakai PIN</div>
      </div>
    </div>

    <!-- MODAL PIN HAPUS PAK -->
    <div id="pinModal">
      <div class="pinBox">
        <h3 style="margin: 0 0 10px; color: #dc2626">🔒 PIN Hapus Diperlukan</h3>
        <p style="font-size: 12px">Mau hapus <b id="hapusKet"></b>?<br />Masukkan PIN Hapus:</p>
        <input
          type="password"
          id="pinHapusInput"
          placeholder="PIN Hapus"
          style="text-align: center; border: 2px solid #dc2626"
        />
        <div style="display: flex; gap: 8px; margin-top: 10px">
          <button
            class="btn"
            style="flex: 1; background: #6b7280; color: #fff"
            onclick="tutupPin()"
          >
            Batal</button
          ><button
            class="btn"
            style="flex: 1; background: #dc2626; color: #fff"
            onclick="konfirmasiHapus()"
          >
            Hapus
          </button>
        </div>
        <div id="pinMsg" style="font-size: 11px; color: #dc2626; margin-top: 6px"></div>
        <div style="font-size: 9px; color: #888; margin-top: 8px">PIN default: 112233</div>
      </div>
    </div>

    <div class="top">
      <span
        style="
          background: #111;
          color: #fff;
          padding: 6px 12px;
          border-radius: 20px;
          font-size: 11px;
        "
        >v7.0 HAPUS PIN</span
      >
      <div style="display: flex; gap: 6px">
        <button
          class="btn"
          style="background: #fff; color: #111; border: 1px solid var(--bd)"
          onclick="toggleDark()"
        >
          🌙 Dark</button
        ><button class="btn" style="background: #2563eb; color: #fff" onclick="sinkronHP()">
          🔄 Sinkron HP</button
        ><button class="btn" style="background: #dc2626; color: #fff" onclick="logout()">
          Logout
        </button>
      </div>
    </div>
    <div class="cards">
      <div class="card g">TOTAL PEMASUKAN<b id="tm">Rp 0</b></div>
      <div class="card r">TOTAL PENGELUARAN<b id="tk">Rp 0</b></div>
      <div class="card b">SALDO SAAT INI<b id="ts">Rp 0</b></div>
    </div>
    <div class="panel">
      <div class="inputRow">
        <input type="date" id="tgl" /><input type="time" id="jam" /><input
          id="ket"
          placeholder="Keterangan"
        /><button class="btn" style="background: #16a34a; color: #fff" onclick="tambah()">
          + Tambah
        </button>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px">
        <input type="number" id="masuk" placeholder="Masuk (Rp)" /><input
          type="number"
          id="keluar"
          placeholder="Keluar (Rp)"
        />
      </div>
      <div class="filterRow">
        <input id="cari" placeholder="🔍 Cari..." oninput="render()" /><select
          id="fBulan"
          onchange="render()"
        >
          <option value="">Semua Bulan</option>
          <option value="01">Jan</option>
          <option value="02">Feb</option>
          <option value="03">Mar</option>
          <option value="04">Apr</option>
          <option value="05">Mei</option>
          <option value="06">Jun</option>
          <option value="07">Jul</option>
          <option value="08">Agu</option>
          <option value="09">Sep</option>
          <option value="10">Okt</option>
          <option value="11">Nov</option>
          <option value="12">Des</option></select
        ><select id="fTahun" onchange="render()">
          <option value="">Semua Tahun</option>
          <option value="2024">2024</option>
          <option value="2025">2025</option>
          <option value="2026">2026</option></select
        ><button class="btn" style="background: #6b7280; color: #fff" onclick="resetFilter()">
          Reset
        </button>
      </div>
      <div id="st" style="font-size: 12px; margin-top: 8px"></div>
      <div style="overflow: auto">
        <table class="tbl">
          <thead>
            <tr>
              <th>Tgl</th>
              <th>Jam</th>
              <th>Ket</th>
              <th>Masuk</th>
              <th>Keluar</th>
              <th>Saldo</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tb"></tbody>
        </table>
      </div>
    </div>
    <script>
      const URL_SHEET =
        "https://script.google.com/macros/s/AKfycbz4JV5c9pFekI68HV5-CFzgWq3V3E1E6xmv_Vnp1ySUeIW4driZ29gV0BNJsdH8nTxT/exec";
      const PASS_TPQ = "12345";
      const PIN_HAPUS = "112233"; // GANTI PIN HAPUS DISINI PAK
      let data = JSON.parse(localStorage.getItem("tpq_v70") || "[]");
      let idxHapus = null;
      if (localStorage.getItem("loginTPQ") === "ok") loginPage.style.display = "none";
      function doLogin() {
        if (pass.value === PASS_TPQ) {
          localStorage.setItem("loginTPQ", "ok");
          loginPage.style.display = "none";
          sinkronHP();
        } else loginMsg.innerText = "Password salah!";
      }
      function logout() {
        localStorage.removeItem("loginTPQ");
        location.reload();
      }
      function toggleDark() {
        document.body.classList.toggle("dark");
      }
      function rp(n) {
        return "Rp " + Number(n || 0).toLocaleString("id-ID");
      }
      function cleanNum(v) {
        if (v == null || v == "") return 0;
        if (typeof v === "number") {
          let n = Math.round(v);
          if (n >= 1000000) return Math.round(n / 100);
          return n;
        }
        let s = String(v).trim();
        if (s.includes(",")) s = s.split(",")[0];
        s = s.replace(/\./g, "").replace(/\s/g, "").replace(/[^\d]/g, "");
        let n = parseInt(s || 0);
        if (n >= 1000000) n = Math.round(n / 100);
        return n;
      }
      function tambah() {
        let t = tgl.value,
          j = jam.value || "00:00",
          k = ket.value.trim(),
          m = parseInt(masuk.value || 0),
          kl = parseInt(keluar.value || 0);
        if (!t || !k) {
          alert("Isi tgl & ket");
          return;
        }
        if (!m && !kl) {
          alert("Isi masuk/keluar");
          return;
        }
        let obj = { t, j, k, m, kl };
        data.push(obj);
        localStorage.setItem("tpq_v70", JSON.stringify(data));
        st.innerText = "Menyimpan...";
        fetch(URL_SHEET, { method: "POST", mode: "no-cors", body: JSON.stringify(obj) }).then(
          () => (st.innerText = "OK tersimpan"),
        );
        render();
        masuk.value = "";
        keluar.value = "";
        ket.value = "";
      }
      function sinkronHP() {
        st.innerText = "Sinkron...";
        fetch(URL_SHEET)
          .then((r) => r.json())
          .then((rows) => {
            data = rows.map((r) => {
              return {
                t: String(r[0]).split("T")[0],
                j: String(r[1] || "").slice(0, 5),
                k: r[2],
                m: cleanNum(r[3]),
                kl: cleanNum(r[4]),
              };
            });
            localStorage.setItem("tpq_v70", JSON.stringify(data));
            render();
            st.innerText = "Sinkron OK " + data.length + " data";
          })
          .catch((e) => (st.innerText = "Gagal"));
      }
      function resetFilter() {
        cari.value = "";
        fBulan.value = "";
        fTahun.value = "";
        render();
      }

      // FUNGSI HAPUS PAKAI PIN PAK
      function mintaHapus(i) {
        idxHapus = i;
        document.getElementById("hapusKet").innerText =
          data[i].k + " " + rp(data[i].m || data[i].kl);
        document.getElementById("pinModal").style.display = "flex";
        document.getElementById("pinHapusInput").value = "";
        document.getElementById("pinHapusInput").focus();
      }
      function tutupPin() {
        document.getElementById("pinModal").style.display = "none";
        idxHapus = null;
      }
      function konfirmasiHapus() {
        let pin = document.getElementById("pinHapusInput").value;
        if (pin !== PIN_HAPUS) {
          document.getElementById("pinMsg").innerText = "PIN salah! PIN hapus adalah " + PIN_HAPUS;
          return;
        }
        // hapus di local
        let dataHapus = data[idxHapus];
        data.splice(idxHapus, 1);
        localStorage.setItem("tpq_v70", JSON.stringify(data));
        tutupPin();
        st.innerText = "Menghapus " + dataHapus.k + "...";
        // hapus di Google Sheet juga
        fetch(URL_SHEET, {
          method: "POST",
          mode: "no-cors",
          body: JSON.stringify({
            action: "delete",
            t: dataHapus.t,
            k: dataHapus.k,
            m: dataHapus.m,
            kl: dataHapus.kl,
          }),
        }).then(() => (st.innerText = "Terhapus: " + dataHapus.k));
        render();
      }

      function render() {
        let tm = 0,
          tk = 0;
        data.forEach((d) => {
          tm += d.m;
          tk += d.kl;
        });
        tm_el = document.getElementById("tm");
        if (tm_el) tm_el.innerText = rp(tm);
        document.getElementById("tk").innerText = rp(tk);
        document.getElementById("ts").innerText = rp(tm - tk);
        let q = cari.value.toLowerCase(),
          fb = fBulan.value,
          ft = fTahun.value;
        let filtered = data
          .map((d, i) => ({ ...d, idx: i }))
          .filter((d) => {
            if (q && !d.k.toLowerCase().includes(q)) return false;
            if (fb && d.t.split("-")[1] !== fb) return false;
            if (ft && d.t.split("-")[0] !== ft) return false;
            return true;
          });
        let running = 0;
        let map = {};
        data.forEach((d, i) => {
          running += d.m - d.kl;
          map[i] = running;
        });
        let html = "";
        filtered.forEach((d) => {
          html += `<tr><td>${d.t}</td><td>${d.j || ""}</td><td>${d.k}</td><td>${d.m ? rp(d.m) : ""}</td><td>${d.kl ? rp(d.kl) : ""}</td><td><b>${rp(map[d.idx])}</b></td><td><button class="btn" style="background:#dc2626;color:#fff;height:28px;font-size:11px;padding:0 8px" onclick="mintaHapus(${d.idx})">🗑️ Hapus</button></td></tr>`;
        });
        document.getElementById("tb").innerHTML = html;
      }
      let now = new Date();
      tgl.value = now.toISOString().slice(0, 10);
      jam.value = now.toTimeString().slice(0, 5);
      render();
    </script>
  </body>
</html>

<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kas TPQ Bulanan Jan-Des FINAL</title>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
      import {
        getFirestore,
        doc,
        setDoc,
        onSnapshot,
      } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

      // Config asli punya Bapak - sudah saya isi
      const firebaseConfig = {
        apiKey: "AIzaSyCUKMda7v33SDM0gNYaX2U28UPfHrCADVc",
        authDomain: "santri-f7718.firebaseapp.com",
        projectId: "santri-f7718",
        storageBucket: "santri-f7718.firebasestorage.app",
        messagingSenderId: "1108309445161",
        appId: "1:1108309445161:web:34a99faacfb8047cfb814",
        measurementId: "G-K411RFSCHX",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const kasRef = doc(db, "kasTPQ", "FINAL");

      // --- FUNGSI SIMPAN BIAR OTOMATIS SINKRON ---
      window.simpanKeFirebase = async (dataKas) => {
        await setDoc(kasRef, { dataKas: dataKas, updateAt: new Date() });
      };

      // --- OTOMATIS MUNCUL DI SEMUA HP ---
      onSnapshot(kasRef, (snap) => {
        if (snap.exists()) {
          const dataOnline = snap.data().dataKas;
          if (dataOnline && dataOnline.length > 0) {
            dataKas = dataOnline; // timpa data lokal dengan data online
            // PANGGIL FUNGSI RENDER BAPAK YANG LAMA
            if (typeof renderTabel === "function") renderTabel();
            if (typeof updateChart === "function") updateChart();
            if (typeof render === "function") render();
          }
        }
      });

      // --- FUNGSI TAMBAH DATA BAPAK YANG LAMA, TINGGAL TAMBAH 1 BARIS INI ---
      // Di dalam function tambahData() Bapak yang lama, setelah push data, panggil:
      let dataKas = JSON.parse(localStorage.getItem("kasFINALFIX") || "[]");
      window.tambahData = () => {
        const tgl = document.getElementById("tanggal").value;
        const ket = document.getElementById("keterangan").value;
        // ... ambil data lain seperti biasa
        // dataKas.push({...})
        // Setelah itu:
        localStorage.setItem("kasFINALFIX", JSON.stringify(dataKas)); // tetap simpan lokal
        simpanKeFirebase(dataKas); // tambah ini -> kirim ke semua HP
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        font-family: Arial;
        padding: 12px;
        background: #f5f5f5;
      }
      .container {
        max-width: 1150px;
        margin: auto;
        background: white;
        padding: 15px;
        border-radius: 10px;
      }
      .kop {
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 2px solid #1e3a8a;
        padding-bottom: 10px;
      }
      .kop img {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid #ddd;
      }
      .form-top {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        background: #eef2ff;
        padding: 10px;
        border-radius: 8px;
        margin-top: 10px;
        align-items: center;
      }
      .form-top input,
      .form-top select {
        padding: 7px;
        border: 1px solid #ccc;
        border-radius: 5px;
        flex: 1;
        min-width: 80px;
        font-size: 13px;
      }
      .input-cari {
        width: 100%;
        padding: 9px !important;
        border: 1.5px solid #f59e0b !important;
        background: #fffbeb;
        border-radius: 6px;
        margin-top: 8px;
        box-sizing: border-box;
      }
      .btn {
        padding: 7px 12px;
        border: none;
        border-radius: 5px;
        color: white;
        cursor: pointer;
        font-weight: bold;
      }
      .btn-tambah {
        background: #16a34a;
      }
      .btn-cetak {
        background: #2563eb;
      }
      .btn-semua {
        background: #0f766e;
      }
      .btn-edit {
        background: #f59e0b;
        padding: 3px 7px;
        font-size: 10px;
      }
      .btn-hapus {
        background: #ef4444;
        padding: 3px 7px;
        font-size: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th,
      td {
        border: 1px solid #bbb;
        padding: 6px;
        text-align: center !important;
        font-size: 12px;
      }
      th {
        background: #1e3a8a;
        color: white;
      }
      .chart-box {
        margin: 10px 0;
        padding: 8px;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
      }
      canvas {
        max-height: 240px !important;
      }
      .ttd {
        display: none;
      }
      @media print {
        .form-top,
        .input-cari,
        .no-print {
          display: none !important;
        }
        .ttd {
          display: block;
          text-align: right;
          margin-top: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="kop">
        <img id="logoTPQ" src="https://via.placeholder.com/55?text=TPQ" />
        <div><b>TPQ BAITURRAHMAN</b><br /><small>Laporan Kas Bulanan Jan-Des</small></div>
        <input
          type="file"
          id="upLogo"
          class="no-print"
          style="margin-left: auto; font-size: 10px"
          accept="image/*"
        />
      </div>

      <div class="form-top">
        <input type="date" id="tanggal" /><input
          type="text"
          id="ket"
          placeholder="Keterangan"
        /><input type="number" id="masuk" placeholder="Masuk" /><input
          type="number"
          id="keluar"
          placeholder="Keluar"
        />
        <select id="filterBulan">
          <option value="all">Lihat Semua Bulan</option>
          <option value="0">Januari</option>
          <option value="1">Februari</option>
          <option value="2">Maret</option>
          <option value="3">April</option>
          <option value="4">Mei</option>
          <option value="5">Juni</option>
          <option value="6">Juli</option>
          <option value="7">Agustus</option>
          <option value="8">September</option>
          <option value="9">Oktober</option>
          <option value="10">November</option>
          <option value="11">Desember</option>
        </select>
        <button class="btn btn-tambah" onclick="tambahData()">+ Tambah</button>
        <button class="btn btn-cetak" onclick="window.print()">Cetak</button>
      </div>

      <input
        type="text"
        id="inputCari"
        class="input-cari"
        placeholder="🔍 KETIK UNTUK CARI - misal: Amal, Bisyaroh, Marbot..."
      />

      <div class="chart-box"><canvas id="kasChart"></canvas></div>
      <div style="font-weight: bold; font-size: 14px; margin-bottom: 8px">Catatan</div>
      <textarea
        id="catatanBox"
        style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px"
        rows="4"
      ></textarea>

      <script>
        // simpan catatan biar tidak hilang
        const box = document.getElementById("catatanBox");
        box.value = localStorage.getItem("catatanTPQ") || "";
        box.addEventListener("input", () => {
          localStorage.setItem("catatanTPQ", box.value);
        });
      </script>
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Tanggal</th>
            <th>Keterangan</th>
            <th>Masuk</th>
            <th>Keluar</th>
            <th>Saldo</th>
            <th class="no-print">Aksi</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
        <tfoot>
          <tr style="background: #dbeafe; font-weight: bold">
            <td colspan="3">Total Saldo Akhir</td>
            <td id="tm"></td>
            <td id="tk"></td>
            <td id="ts" colspan="2"></td>
          </tr>
        </tfoot>
      </table>
      <div class="ttd">
        <p>Malang, <span id="tglC"></span><br />Bendahara,<br /><br /><br />(__________)</p>
      </div>
    </div>
    <script>
      let dataKas = JSON.parse(localStorage.getItem("kasFINALFIX")) || [
        { tanggal: "2026-09-10", keterangan: "Kas Khataman", masuk: 13000, keluar: 0 },
        { tanggal: "2026-09-10", keterangan: "KasTPQ", masuk: 1050000, keluar: 0 },
        { tanggal: "2026-09-10", keterangan: "B. Masputo", masuk: 60000, keluar: 0 },
        { tanggal: "2026-09-10", keterangan: "Kas Mus/Marbot", masuk: 70000, keluar: 0 },
        { tanggal: "2026-09-10", keterangan: "Bisyaroh 6 Guru", masuk: 0, keluar: 1060000 },
        { tanggal: "2026-09-10", keterangan: "Honor Marbot", masuk: 0, keluar: 70000 },
        { tanggal: "2026-10-15", keterangan: "Amal Santri", masuk: 1080000, keluar: 0 },
        { tanggal: "2026-10-15", keterangan: "Kas Khataman", masuk: 130000, keluar: 0 },
      ];
      let editIndex = -1,
        myChart = null;
      function fmt(t) {
        const d = new Date(t);
        return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
      }
      function renderTabel() {
        const keyword = document.getElementById("inputCari").value.toLowerCase();
        const filterB = document.getElementById("filterBulan").value;
        const tbody = document.getElementById("tbody");
        tbody.innerHTML = "";
        let saldo = 0,
          totalM = 0,
          totalK = 0,
          no = 1;
        let bulanMasuk = Array(12).fill(0),
          bulanKeluar = Array(12).fill(0),
          bulanSaldo = Array(12).fill(0);
        let saldoJalan = 0;
        let sorted = [...dataKas].sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));
        sorted.forEach((it) => {
          let b = new Date(it.tanggal).getMonth();
          bulanMasuk[b] += parseInt(it.masuk) || 0;
          bulanKeluar[b] += parseInt(it.keluar) || 0;
          saldoJalan += (parseInt(it.masuk) || 0) - (parseInt(it.keluar) || 0);
          bulanSaldo[b] = saldoJalan;
        });
        // Tabel dengan filter
        dataKas.forEach((it, i) => {
          let bulanData = new Date(it.tanggal).getMonth();
          if (filterB !== "all" && bulanData != parseInt(filterB)) return;
          if (keyword && !it.keterangan.toLowerCase().includes(keyword)) return;
          saldo += (parseInt(it.masuk) || 0) - (parseInt(it.keluar) || 0);
          totalM += parseInt(it.masuk) || 0;
          totalK += parseInt(it.keluar) || 0;
          tbody.innerHTML += `<tr><td>${no}</td><td>${fmt(it.tanggal)}</td><td>${it.keterangan}</td><td style="color:green">Rp ${Number(it.masuk).toLocaleString("id-ID")}</td><td style="color:red">Rp ${Number(it.keluar).toLocaleString("id-ID")}</td><td><b>Rp ${saldo.toLocaleString("id-ID")}</b></td><td class="no-print"><button class="btn btn-edit" onclick="editData(${i})">Edit</button> <button class="btn btn-hapus" onclick="hapusData(${i})">Hapus</button></td></tr>`;
          no++;
        });
        document.getElementById("tm").innerText = "Rp " + totalM.toLocaleString("id-ID");
        document.getElementById("tk").innerText = "Rp " + totalK.toLocaleString("id-ID");
        document.getElementById("ts").innerText = "Rp " + saldo.toLocaleString("id-ID");
        document.getElementById("tglC").innerText = new Date().toLocaleDateString("id-ID");
        if (myChart) myChart.destroy();
        const labels = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "Mei",
          "Jun",
          "Jul",
          "Agu",
          "Sep",
          "Okt",
          "Nov",
          "Des",
        ];
        myChart = new Chart(document.getElementById("kasChart"), {
          type: "line",
          data: {
            labels: labels,
            datasets: [
              {
                label: "Masuk",
                data: bulanMasuk,
                borderColor: "green",
                borderWidth: 1,
                pointRadius: 2,
                tension: 0.35,
              },
              {
                label: "Keluar",
                data: bulanKeluar,
                borderColor: "red",
                borderWidth: 1,
                pointRadius: 2,
                tension: 0.35,
              },
              {
                label: "Saldo",
                data: bulanSaldo,
                borderColor: "blue",
                backgroundColor: "rgba(37,99,235,0.12)",
                borderWidth: 1.2,
                pointRadius: 2.5,
                tension: 0.35,
                fill: true,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } },
            },
          },
        });
          }

      function tambahData() {
        const t = document.getElementById("tanggal").value,
          k = document.getElementById("ket").value,
          m = document.getElementById("masuk").value || 0,
          kl = document.getElementById("keluar").value || 0;
        if (!t || !k) {
          alert("Isi tanggal & keterangan");
          return;
        }
        if (editIndex >= 0) {
          dataKas[editIndex] = { tanggal: t, keterangan: k, masuk: m, keluar: kl };
          editIndex = -1;
        } else dataKas.push({ tanggal: t, keterangan: k, masuk: m, keluar: kl });
        document.getElementById("tanggal").value = "";
        document.getElementById("ket").value = "";
        document.getElementById("masuk").value = "";
        document.getElementById("keluar").value = "";
        renderTabel();
      }
      function editData(i) {
        const it = dataKas[i];
        document.getElementById("tanggal").value = it.tanggal;
        document.getElementById("ket").value = it.keterangan;
        document.getElementById("masuk").value = it.masuk;
        document.getElementById("keluar").value = it.keluar;
        editIndex = i;
      }
      function hapusData(i) {
        if (confirm("Hapus data ini Pak?")) {
          dataKas.splice(i, 1);
          renderTabel();
        }
      }
      document.getElementById("inputCari").addEventListener("input", renderTabel);
      document.getElementById("filterBulan").addEventListener("change", renderTabel);
      document.getElementById("upLogo").addEventListener("change", (e) => {
        const r = new FileReader();
        r.onload = () => (document.getElementById("logoTPQ").src = r.result);
        r.readAsDataURL(e.target.files[0]);
      });
      renderTabel();
    </script>
  </body>
</html>

<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TPQ v6.9 Lengkap</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111;--bd:#e5e7eb}body.dark{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--bd:#334155}
*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:system-ui;margin:0;padding:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.card{padding:14px;border-radius:12px;color:#fff;text-align:center}.card b{display:block;font-size:18px;margin-top:4px}.g{background:#16a34a}.r{background:#dc2626}.b{background:#2563eb}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
input,select{height:44px;width:100%;border:1px solid var(--bd);border-radius:8px;padding:0 12px;background:var(--card);color:var(--text)}.btn{height:44px;background:#16a34a;color:#fff;border:0;border-radius:8px;padding:0 12px;font-weight:700;cursor:pointer;font-size:13px}
#loginPage{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.loginBox{background:var(--card);border:1px solid var(--bd);padding:24px;border-radius:16px;width:100%;max-width:360px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.tbl{width:100%;border-collapse:collapse;margin-top:8px}.tbl th{background:#2563eb;color:#fff;padding:8px;font-size:12px}.tbl td{padding:8px;border-bottom:1px solid var(--bd);font-size:12px}
.filterRow{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-top:10px}
@media(max-width:600px){.filterRow{grid-template-columns:1fr 1fr}.inputRow{grid-template-columns:1fr!important}}
.inputRow{display:grid;grid-template-columns:1.1fr.8fr 1.6fr auto;gap:8px}
</style></head><body>

<div id="loginPage">
  <div class="loginBox">
    <h2 style="margin:0 0 16px">Login TPQ Baiturrahman</h2>
    <input type="password" id="pass" placeholder="Password" style="text-align:center">
    <button class="btn" style="width:100%;margin-top:10px;background:#2563eb" onclick="doLogin()">Masuk</button>
    <div id="loginMsg" style="font-size:12px;color:#dc2626;margin-top:8px"></div>
    <div style="font-size:10px;color:#888;margin-top:10px">v6.9 Jam + Filter + Fix 50rb</div>
  </div>
</div>

<div class="top">
  <span style="background:#111;color:#fff;padding:6px 12px;border-radius:20px;font-size:11px">v6.9 FIX LENGKAP</span>
  <div style="display:flex;gap:6px"><button class="btn" style="background:#fff;color:#111;border:1px solid var(--bd)" onclick="toggleDark()">🌙 Dark</button><button class="btn" style="background:#2563eb" onclick="sinkronHP()">🔄 Sinkron HP</button><button class="btn" style="background:#dc2626" onclick="logout()">Logout</button><span id="st2" style="font-size:11px;padding:6px 10px;background:var(--card);border:1px solid var(--bd);border-radius:20px">Siap</span></div>
</div>

<div class="cards"><div class="card g">TOTAL PEMASUKAN<b id="tm">Rp 0</b></div><div class="card r">TOTAL PENGELUARAN<b id="tk">Rp 0</b></div><div class="card b">SALDO SAAT INI<b id="ts">Rp 0</b></div></div>

<div class="panel">
<div class="inputRow">
  <input type="date" id="tgl">
  <input type="time" id="jam">
  <input id="ket" placeholder="Keterangan">
  <button class="btn" onclick="tambah()">+ Tambah & Sinkron</button>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
  <input type="number" id="masuk" placeholder="Masuk (Rp) - ketik 50000">
  <input type="number" id="keluar" placeholder="Keluar (Rp)">
</div>

<!-- FILTER ADA LAGI PAK -->
<div class="filterRow">
  <input id="cari" placeholder="🔍 Cari... (Infaq/pln)" oninput="render()">
  <select id="fBulan" onchange="render()"><option value="">Semua Bulan</option><option value="01">Januari</option><option value="02">Februari</option><option value="03">Maret</option><option value="04">April</option><option value="05">Mei</option><option value="06">Juni</option><option value="07">Juli</option><option value="08">Agustus</option><option value="09">September</option><option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option></select>
  <select id="fTahun" onchange="render()"><option value="">Semua Tahun</option><option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option></select>
  <button class="btn" style="background:#6b7280" onclick="resetFilter()">Reset Filter</button>
</div>

<div id="st" style="font-size:12px;margin-top:8px;color:#16a34a"></div>
<div style="overflow:auto"><table class="tbl"><thead><tr><th>Tgl</th><th>Jam</th><th>Ket</th><th>Masuk</th><th>Keluar</th><th>Saldo</th></tr></thead><tbody id="tb"></tbody></table></div>
</div>

<script>
const URL_SHEET="https://script.google.com/macros/s/AKfycbz4JV5c9pFekI68HV5-CFzgWq3V3E1E6xmv_Vnp1ySUeIW4driZ29gV0BNJsdH8nTxT/exec";
const PASS_TPQ="12345";
let data=JSON.parse(localStorage.getItem('tpq_v69')||'[]');
if(localStorage.getItem('loginTPQ')==='ok') document.getElementById('loginPage').style.display='none';
function doLogin(){ if(document.getElementById('pass').value===PASS_TPQ){localStorage.setItem('loginTPQ','ok'); document.getElementById('loginPage').style.display='none'; sinkronHP();} else document.getElementById('loginMsg').innerText='Password salah!';}
function logout(){localStorage.removeItem('loginTPQ'); location.reload();}
function toggleDark(){document.body.classList.toggle('dark')}
function rp(n){return 'Rp '+Number(n||0).toLocaleString('id-ID')}
function cleanNum(v){
 if(v==null||v=='')return 0;
 if(typeof v==='number'){let num=Math.round(v); if(num>=1000000) return Math.round(num/100); return num;}
 let s=String(v).trim(); if(s.includes(',')) s=s.split(',')[0]; s=s.replace(/\./g,'').replace(/\s/g,'').replace(/[^\d]/g,''); let num=parseInt(s||0); if(num>=1000000) num=Math.round(num/100); return num;
}
function tambah(){
 let t=tgl.value,j=jam.value||'00:00',k=ket.value.trim(),m=parseInt(masuk.value||0),kl=parseInt(keluar.value||0);
 if(!t||!k){alert('Isi tgl & ket');return} if(!m&&!kl){alert('Isi masuk/keluar');return}
 let obj={t,j,k,m,kl}; data.push(obj); localStorage.setItem('tpq_v69',JSON.stringify(data));
 document.getElementById('st').innerText='Menyimpan '+rp(m||kl)+'...';
 fetch(URL_SHEET,{method:'POST',mode:'no-cors',body:JSON.stringify(obj)}).then(()=>document.getElementById('st').innerText='OK tersimpan');
 render(); masuk.value='';keluar.value='';ket.value='';
}
function sinkronHP(){
 document.getElementById('st').innerText='Sinkron HP...'; document.getElementById('st2').innerText='Sinkron...';
 fetch(URL_SHEET).then(r=>r.json()).then(rows=>{
  data=rows.map(r=>{return{t:String(r[0]).split('T')[0],j:String(r[1]||'').slice(0,5),k:r[2],m:cleanNum(r[3]),kl:cleanNum(r[4])}});
  localStorage.setItem('tpq_v69',JSON.stringify(data)); render();
  document.getElementById('st').innerText='Sinkron OK '+data.length+' data - Rp 50.000 FIX'; document.getElementById('st2').innerText='Siap';
 }).catch(e=>document.getElementById('st').innerText='Gagal '+e);
}
function resetFilter(){cari.value=''; fBulan.value=''; fTahun.value=''; render();}
function render(){
 let tm=0,tk=0; data.forEach(d=>{tm+=d.m;tk+=d.kl});
 document.getElementById('tm').innerText=rp(tm); document.getElementById('tk').innerText=rp(tk); document.getElementById('ts').innerText=rp(tm-tk);
 let q=cari.value.toLowerCase(), fb=fBulan.value, ft=fTahun.value;
 let filtered=data.filter(d=>{
   if(q &&!d.k.toLowerCase().includes(q)) return false;
   if(fb && d.t.split('-')[1]!==fb) return false;
   if(ft && d.t.split('-')[0]!==ft) return false;
   return true;
 });
 let s=0; let html='';
 // saldo jalan sesuai urutan asli
 let running=0; let mapSaldo={}; data.forEach((d,i)=>{running+=d.m-d.kl; mapSaldo[i]=running;});
 // tampilkan filtered tapi saldo tetap sesuai urutan asli
 filtered.forEach(d=>{
   let idx=data.indexOf(d); s=mapSaldo[idx];
   html+=`<tr><td>${d.t}</td><td>${d.j||''}</td><td>${d.k}</td><td>${d.m?rp(d.m):''}</td><td>${d.kl?rp(d.kl):''}</td><td><b>${rp(s)}</b></td></tr>`;
 });
 document.getElementById('tb').innerHTML=html;
 document.getElementById('st').innerText=`Sinkron OK ${data.length} data | Tampil ${filtered.length} data`;
}
let now=new Date(); tgl.value=now.toISOString().slice(0,10); jam.value=now.toTimeString().slice(0,5); render();
</script></body></html>

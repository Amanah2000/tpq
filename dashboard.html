<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TPQ v8.4 FINAL</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--border:#334155}
.light{--bg:#f1f5f9;--card:#ffffff;--text:#0f172a;--border:#cbd5e1}
body{font-family:system-ui;margin:0;background:var(--bg);color:var(--text)}
header{padding:10px;background:var(--card);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;border-bottom:1px solid var(--border)}
.card{background:var(--card);margin:12px;padding:12px;border-radius:12px;border:1px solid var(--border)}
input,select,button{padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin:4px}
button{cursor:pointer;font-weight:bold}
.btn{padding:8px 14px}
.green{background:#16a34a;color:#fff}.orange{background:#ea580c;color:#fff}.blue{background:#2563eb;color:#fff}.red{background:#dc2626;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{border:1px solid var(--border);padding:6px;font-size:13px}
.badge{padding:4px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--border);font-size:12px}
@media print{.no-print{display:none}}
</style></head>
<body>
<header>
<div><b>TPQ v8.4 FINAL</b><br><small id="kodeTop">582c05ea9dadf831af03</small></div>
<div class="no-print" style="display:flex;gap:6px;align-items:center">
<span id="statusKoneksi" class="badge">Memuat...</span>
<button class="btn" onclick="toggleDark()">🌙 Dark/Light</button>
<button class="btn red" onclick="logout()">🚪 Logout</button>
</div>
</header>

<div class="card no-print">
<b>🔑 Kode nPoint SATU KODE</b><br>
<input id="npointId" style="width:58%" value="582c05ea9dadf831af03">
<button class="btn green" onclick="simpanNPoint()">💾 Simpan</button>
<button class="btn orange" onclick="ambilNPoint()">☁️ Ambil</button>
</div>

<div class="card">
<div class="no-print">
<button class="btn green" onclick="showTab('kas')">💰 Kas</button>
<button class="btn blue" onclick="showTab('santri')">🧒 Santri</button>
<span class="badge" id="ringkas"></span>
</div>
<div id="tab-kas"><h3>Kas TPQ</h3><div class="no-print"><input id="tgl" type="date"><input id="ket" placeholder="Keterangan"><input id="masuk" type="number" placeholder="Masuk"><input id="keluar" type="number" placeholder="Keluar"><button class="btn green" onclick="tambahKas()">+ Input</button><button class="btn blue" onclick="window.print()">🖨️ Cetak</button></div><table id="tblKas"><thead><tr><th>Tgl</th><th>Ket</th><th>Masuk</th><th>Keluar</th><th>Saldo</th><th class="no-print">Aksi</th></tr></thead><tbody></tbody></table></div>
<div id="tab-santri" style="display:none"><h3>Santri</h3><div class="no-print"><input id="s_nama" placeholder="Nama"><select id="s_lp"><option>L</option><option>P</option></select><input id="s_wali" placeholder="Wali"><input id="s_hp" placeholder="HP"><button class="btn green" onclick="tambahSantri()">+ Input</button><button class="btn blue" onclick="window.print()">🖨️ Cetak</button></div><table id="tblSantri"><thead><tr><th>Nama</th><th>L/P</th><th>Wali</th><th>HP</th><th class="no-print">Aksi</th></tr></thead><tbody></tbody></table></div>
</div>

<script>
const KODE_KEY='npoint_satu_kode_v83';
let kasData=JSON.parse(localStorage.getItem('kasData')||'[]');
let santriData=JSON.parse(localStorage.getItem('santriData')||'[]');
function showTab(t){document.getElementById('tab-kas').style.display=t==='kas'?'block':'none';document.getElementById('tab-santri').style.display=t==='santri'?'block':'none';}
function fmt(n){return 'Rp '+Number(n||0).toLocaleString('id-ID')}
function tampilKas(){let tbody=document.querySelector('#tblKas tbody');tbody.innerHTML='';let s=0;kasData.forEach((r,i)=>{s+=Number(r.masuk||0)-Number(r.keluar||0);tbody.innerHTML+=`<tr><td>${r.tgl}</td><td>${r.ket}</td><td>${r.masuk?fmt(r.masuk):''}</td><td>${r.keluar?fmt(r.keluar):''}</td><td>${fmt(s)}</td><td class=no-print><button onclick="hapusKas(${i})">Hapus</button></td></tr>`;});document.getElementById('ringkas').innerText=`Kas: ${fmt(s)} | Santri: ${santriData.length}`;localStorage.setItem('kasData',JSON.stringify(kasData));}
function tampilSantri(){let tbody=document.querySelector('#tblSantri tbody');tbody.innerHTML='';santriData.forEach((r,i)=>{tbody.innerHTML+=`<tr><td>${r.nama}</td><td>${r.lp}</td><td>${r.wali}</td><td>${r.hp}</td><td class=no-print><button onclick="hapusSantri(${i})">Hapus</button></td></tr>`;});localStorage.setItem('santriData',JSON.stringify(santriData));}
function tambahKas(){let o={tgl:document.getElementById('tgl').value,ket:document.getElementById('ket').value,masuk:Number(document.getElementById('masuk').value||0),keluar:Number(document.getElementById('keluar').value||0)};if(!o.tgl||!o.ket){alert('Isi tgl & ket');return;}kasData.push(o);tampilKas();autoSimpan();}
function hapusKas(i){if(confirm('Hapus?')){kasData.splice(i,1);tampilKas();autoSimpan();}}
function tambahSantri(){let o={nama:document.getElementById('s_nama').value,lp:document.getElementById('s_lp').value,wali:document.getElementById('s_wali').value,hp:document.getElementById('s_hp').value};if(!o.nama){alert('Isi nama');return;}santriData.push(o);tampilSantri();autoSimpan();}
function hapusSantri(i){if(confirm('Hapus?')){santriData.splice(i,1);tampilSantri();autoSimpan();}}
function getKode(){let v=document.getElementById('npointId').value.trim().replace('https://api.npoint.io/','');return v||'582c05ea9dadf831af03';}
function simpanNPoint(){let kode=getKode();localStorage.setItem(KODE_KEY,kode);document.getElementById('statusKoneksi').innerText='⏳ Menyimpan...';fetch('https://api.npoint.io/'+kode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kas:kasData,santri:santriData})}).then(()=>{document.getElementById('statusKoneksi').innerText='🟢 Tersambung! Kas:'+kasData.length+' Santri:'+santriData.length;});}
function ambilNPoint(){let kode=getKode();localStorage.setItem(KODE_KEY,kode);document.getElementById('statusKoneksi').innerText='⏳ Mengambil...';fetch('https://api.npoint.io/'+kode).then(r=>r.json()).then(j=>{if(Array.isArray(j)){kasData=j;santriData=[];}else{kasData=j.kas||[];santriData=j.santri||[];}tampilKas();tampilSantri();document.getElementById('statusKoneksi').innerText='🟢 Tersambung! Kas:'+kasData.length+' Santri:'+santriData.length;});}
function autoSimpan(){let kode=localStorage.getItem(KODE_KEY)||'582c05ea9dadf831af03';fetch('https://api.npoint.io/'+kode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kas:kasData,santri:santriData})}).then(()=>{document.getElementById('statusKoneksi').innerText='🟢 Tersambung! Kas:'+kasData.length+' Santri:'+santriData.length;});}
function toggleDark(){document.body.classList.toggle('light');localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark');}
function logout(){if(confirm('Logout Pak? Data di HP hilang tapi di langit aman Pak!')){localStorage.removeItem('kasData');localStorage.removeItem('santriData');location.reload();}}
(function(){let k=localStorage.getItem(KODE_KEY)||'582c05ea9dadf831af03';document.getElementById('npointId').value=k;document.getElementById('kodeTop').innerText=k;if(localStorage.getItem('theme')==='light')document.body.classList.add('light');tampilKas();tampilSantri();ambilNPoint();})();
</script></body></html>

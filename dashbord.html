<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPQ v8.1 - Dashboard</title>
<style>
:root{ --bg:#f5f5f5; --card:#fff; --text:#000; --border:#000; --input:#fff; }
body.dark{ --bg:#121212; --card:#1e1e1e; --text:#e0e0e0; --border:#555; --input:#2d2d2d; }
body{font-family:Arial,sans-serif; background:var(--bg); color:var(--text); margin:0;}
.container{max-width:1100px;margin:20px auto;background:var(--card);padding:16px; border-radius:12px;}
.kop{display:flex; align-items:center; gap:12px; border-bottom:2px solid var(--border); padding-bottom:10px;}
.tabs{display:flex; gap:8px; margin:14px 0; justify-content:center;}
.tab{padding:10px 18px; border-radius:20px; border:2px solid #2e7d32; cursor:pointer; font-weight:bold; background:var(--card); color:var(--text);}
.tab.active{background:#2e7d32; color:#fff;}
.sync-box{background:#e3f2fd; border:2px dashed #0d6efd; border-radius:10px; padding:12px; margin:12px 0;}
body.dark.sync-box{background:#1a2332;}
.sync-row{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.sync-row input{flex:1; min-width:160px; padding:10px; border:1.5px solid var(--border); border-radius:6px; background:var(--input); color:var(--text);}
.badge{font-size:10px; background:#198754; color:#fff; padding:3px 8px; border-radius:10px;}
input,select{padding:11px; border:1.5px solid var(--border); border-radius:6px; background:var(--input); color:var(--text); width:100%; box-sizing:border-box;}
button{padding:9px 13px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; font-size:12.5px;}
.btn-input{background:#0d6efd; color:#fff;}.btn-pdf{background:#198754; color:#fff;}.btn-bak{background:#455a64; color:#fff;}
.btn-cloud{background:#7b1fa2; color:#fff;}.btn-pull{background:#ef6c00; color:#fff;}
.btn-dark{position:fixed; top:8px; right:8px; z-index:999; padding:7px 12px; border-radius:20px; background:#222; color:#fff;}
.table-wrap{width:100%; overflow-x:auto; border:1.5px solid var(--border); border-radius:6px; margin-top:12px;}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:900px;}
th,td{border:1px solid var(--border); padding:7px; text-align:center;} th{background:#2e7d32; color:#fff;}
.hidden{display:none;}
.kas-grid{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;}
</style>
</head>
<body>
<button id="btnDark" class="btn-dark" onclick="toggleDark()">🌙 Gelap</button>
<div class="container">
<div class="kop"><img src="logo.png" onerror="this.src='https://via.placeholder.com/65'" style="width:65px;height:65px;border-radius:50%;"><div><h2 style="margin:0;">TPQ BAITURRAHMAN v8.1</h2><p style="margin:2px 0;">Filter Bulan Tahun Kas Pak</p><p id="infoTotal" style="font-size:12px;"></p></div><button onclick="logout()" style="margin-left:auto; background:#dc3545; color:#fff;">Logout</button></div>

<div class="tabs">
<button id="tabKas" class="tab active" onclick="showTab('kas')">💰 Kas TPQ</button>
<button id="tabSantri" class="tab" onclick="showTab('santri')">👳 Santri</button>
</div>

<div id="viewKas">
<div class="sync-box" style="background:#e8f5e9; border-color:#2e7d32;">
<h4 style="margin:4px 0;">💰 Kas <span id="badgeKas" class="badge" style="display:none;">Tersambung</span></h4>
<div class="sync-row"><input id="kasId" placeholder="Kode nPoint Kas"><button class="btn-cloud" onclick="simpanKasCloud()">☁️ Simpan</button><button class="btn-pull" onclick="ambilKasCloud()">🌧️ Ambil</button><span id="statusKas">🔴 Terputus</span></div>
<div id="statusKasMsg" style="font-size:11px;"></div>
</div>

<div class="kas-grid">
<input id="kasTgl" type="date" style="width:150px;">
<input id="kasKet" placeholder="Keterangan" style="flex:1; min-width:160px;">
<input id="kasMasuk" placeholder="Masuk" type="number" style="width:110px;">
<input id="kasKeluar" placeholder="Keluar" type="number" style="width:110px;">
<button class="btn-input" onclick="tambahKas()">+ Tambah</button>
</div>

<div style="background:#fff3cd; border:1.5px solid #ff9800; border-radius:8px; padding:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:8px 0;">
<span style="font-weight:bold; font-size:12px;">🔍 Filter:</span>
<select id="filterBulan" onchange="renderKas()" style="width:130px; padding:8px;">
<option value="all">Semua Bulan</option>
<option value="01">Januari</option><option value="02">Februari</option><option value="03">Maret</option>
<option value="04">April</option><option value="05">Mei</option><option value="06">Juni</option>
<option value="07">Juli</option><option value="08">Agustus</option><option value="09">September</option>
<option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option>
</select>
<select id="filterTahun" onchange="renderKas()" style="width:110px; padding:8px;"><option value="all">Semua Tahun</option></select>
<input id="filterKet" placeholder="Cari ket..." oninput="renderKas()" style="flex:1; min-width:120px; padding:8px;">
<button onclick="resetFilterKas()" style="background:#6c757d; color:#fff;">Reset</button>
</div>
<div id="infoFilterKas" style="font-size:12px; font-weight:bold; color:#2e7d32; background:#e8f5e9; padding:6px; border-radius:6px; margin-bottom:6px;"></div>

<div style="display:flex; gap:6px; flex-wrap:wrap;">
<button style="background:#0dcaf0; color:#000;" onclick="exportExcel()">📊 Excel (filter)</button>
<button class="btn-pdf" onclick="window.print()">🖨️ Cetak</button>
<button style="background:#ff9800; color:#fff;" onclick="rekapKas()">📈 Rekap</button>
<button class="btn-bak" style="background:#dc3545; color:#fff;" onclick="hapusKasSemua()">🗑️ Hapus</button>
</div>

<div class="table-wrap"><table><thead><tr><th>Tgl</th><th>Jam</th><th>Ket</th><th>Masuk</th><th>Keluar</th><th>Saldo</th><th>Aksi</th></tr></thead><tbody id="tbodyKas"></tbody></table></div>
</div>

<div id="viewSantri" class="hidden">
<div class="sync-box">
<h4>☁️ Santri <span id="badgeSync" class="badge" style="display:none;">Tersambung</span></h4>
<div class="sync-row"><input id="syncId" placeholder="Kode nPoint Santri"><button class="btn-cloud" onclick="simpanCloud()">☁️ Simpan</button><button class="btn-pull" onclick="ambilCloud()">⬇️ Ambil</button></div>
<div id="statusSync" style="font-size:11px;"></div>
</div>
<div style="display:grid; grid-template-columns:1fr 100px 90px; gap:6px; margin:8px 0;"><input id="nama" placeholder="Nama"><select id="jk"><option value="">L/P</option><option value="L">L</option><option value="P">P</option></select><input id="usia" placeholder="Usia" type="number"></div>
<div style="display:grid; grid-template-columns:1fr 140px; gap:6px;"><input id="wali" placeholder="Wali"><input id="hp" placeholder="HP"></div>
<div style="display:grid; grid-template-columns:1fr 160px; gap:6px; margin-top:6px;"><input id="alamat" placeholder="Alamat"><input id="tgl" type="date"></div>
<div style="margin:8px 0; display:flex; gap:6px;"><button class="btn-input" onclick="inputData()">+ Input</button><button class="btn-pdf" onclick="window.print()">Cetak</button></div>
<div class="table-wrap"><table><thead><tr><th>No</th><th>Nama</th><th>L/P</th><th>Usia</th><th>Wali</th><th>HP</th><th>Alamat</th><th>Tgl</th><th>Aksi</th></tr></thead><tbody id="tbody"></tbody></table></div>
</div>
</div>
<script>
if(localStorage.getItem('tpq_login')!=='true') location.href='index.html';
function logout(){ if(confirm('Logout Pak?')){ localStorage.removeItem('tpq_login'); location.href='index.html'; } }
function toggleDark(){ document.body.classList.toggle('dark'); let d=document.body.classList.contains('dark'); localStorage.setItem('tpq_dark',''+d); document.getElementById('btnDark').innerText=d?'☀️ Terang':'🌙 Gelap'; }
function loadDark(){ if(localStorage.getItem('tpq_dark')=='true'){ document.body.classList.add('dark'); document.getElementById('btnDark').innerText='☀️ Terang'; } }
function showTab(t){ document.getElementById('viewKas').classList.toggle('hidden', t!=='kas'); document.getElementById('viewSantri').classList.toggle('hidden', t!=='santri'); document.getElementById('tabKas').classList.toggle('active', t==='kas'); document.getElementById('tabSantri').classList.toggle('active', t==='santri'); localStorage.setItem('tpq_tab', t); }
let kasData = JSON.parse(localStorage.getItem('kas_tpq')||'[]');
let kasId = localStorage.getItem('kas_npoint')||'';
document.getElementById('kasId').value=kasId;
document.getElementById('kasTgl').valueAsDate=new Date();
function getKasUrl(){ let id=document.getElementById('kasId').value.trim(); if(!id) return null; if(id.includes('npoint.io')) id=id.split('/').pop(); return 'https://api.npoint.io/'+id; }
function setKasStatus(msg,ok){ document.getElementById('statusKasMsg').innerText=msg; document.getElementById('statusKas').innerText=ok?'🟢 Tersambung':'🔴 Terputus'; document.getElementById('statusKas').style.color=ok?'green':'red'; document.getElementById('badgeKas').style.display=ok?'inline-block':'none'; }
function getFilterKas(){ return {bln: document.getElementById('filterBulan').value, thn: document.getElementById('filterTahun').value, ket: document.getElementById('filterKet').value.toLowerCase().trim() }; }
function resetFilterKas(){ document.getElementById('filterBulan').value='all'; document.getElementById('filterTahun').value='all'; document.getElementById('filterKet').value=''; renderKas(); }
function isiTahunKas(){
  let sel=document.getElementById('filterTahun'); let cur=sel.value;
  let tahunSet=new Set(kasData.map(d=> (d.tgl||'').split('-')[0]).filter(Boolean));
  let yNow=new Date().getFullYear(); for(let y=yNow-2; y<=yNow+1; y++) tahunSet.add(String(y));
  sel.innerHTML='<option value="all">Semua Tahun</option>';
  Array.from(tahunSet).sort().reverse().forEach(t=>{ let o=document.createElement('option'); o.value=t; o.textContent=t; sel.appendChild(o); });
  if(cur && sel.querySelector(`option[value="${cur}"]`)) sel.value=cur;
}
function renderKas(){
  isiTahunKas();
  let f=getFilterKas();
  let filtered=kasData.map((d,i)=>({...d, origIdx:i})).filter(d=>{
    if(f.bln!=='all' && (d.tgl||'').split('-')[1]!==f.bln) return false;
    if(f.thn!=='all' && (d.tgl||'').split('-')[0]!==f.thn) return false;
    if(f.ket &&!(d.ket||'').toLowerCase().includes(f.ket)) return false;
    return true;
  });
  let totalSaldo=0; kasData.forEach(d=>{ totalSaldo+=(parseInt(d.masuk)||0)-(parseInt(d.keluar)||0); });
  let masukF=0, keluarF=0; filtered.forEach(d=>{ masukF+=(parseInt(d.masuk)||0); keluarF+=(parseInt(d.keluar)||0); });
  let html='';
  filtered.forEach(d=>{
    let run=0; for(let j=0;j<=d.origIdx;j++){ run+=(parseInt(kasData[j].masuk)||0)-(parseInt(kasData[j].keluar)||0); }
    html+=`<tr><td>${d.tgl}</td><td>${d.jam}</td><td>${d.ket}</td><td style="color:green">Rp ${(d.masuk||0).toLocaleString('id-ID')}</td><td style="color:red">Rp ${(d.keluar||0).toLocaleString('id-ID')}</td><td style="color:#0d6efd; font-weight:bold;">Rp ${run.toLocaleString('id-ID')}</td><td><button style="background:#ffc107; padding:5px;" onclick="editKas(${d.origIdx})">Edit</button> <button style="background:#dc3545; color:#fff; padding:5px;" onclick="hapusKas(${d.origIdx})">Hapus</button></td></tr>`;
  });
  document.getElementById('tbodyKas').innerHTML=html||'<tr><td colspan=7>Belum ada data Pak untuk filter ini</td></tr>';
  document.getElementById('infoFilterKas').innerText=`Filter: ${filtered.length} data | Masuk: Rp ${masukF.toLocaleString('id-ID')} | Keluar: Rp ${keluarF.toLocaleString('id-ID')} | Saldo Filter: Rp ${(masukF-keluarF).toLocaleString('id-ID')} | Total Semua: Rp ${totalSaldo.toLocaleString('id-ID')}`;
  document.getElementById('infoTotal').innerText=`Kas Total: Rp ${totalSaldo.toLocaleString('id-ID')} | Santri: ${data.length}`;
  localStorage.setItem('kas_tpq', JSON.stringify(kasData));
  let id=document.getElementById('kasId').value.trim(); if(id) localStorage.setItem('kas_npoint', id);
}
let kasEdit=-1;
function tambahKas(){
  let tgl=document.getElementById('kasTgl').value||new Date().toISOString().split('T')[0];
  let ket=document.getElementById('kasKet').value.trim();
  let masuk=parseInt(document.getElementById('kasMasuk').value)||0;
  let keluar=parseInt(document.getElementById('kasKeluar').value)||0;
  let jam=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  if(!ket){ alert('Keterangan wajib Pak!'); return; }
  let obj={tgl,jam,ket,masuk,keluar};
  if(kasEdit>=0){ kasData[kasEdit]=obj; kasEdit=-1; } else kasData.push(obj);
  document.getElementById('kasKet').value=''; document.getElementById('kasMasuk').value=''; document.getElementById('kasKeluar').value='';
  renderKas();
}
function editKas(i){ let d=kasData[i]; document.getElementById('kasTgl').value=d.tgl; document.getElementById('kasKet').value=d.ket; document.getElementById('kasMasuk').value=d.masuk; document.getElementById('kasKeluar').value=d.keluar; kasEdit=i; window.scrollTo(0,0); }
function hapusKas(i){ if(confirm('Hapus Pak?')){ kasData.splice(i,1); renderKas(); } }
function hapusKasSemua(){ let pin=prompt('PIN 1234'); if(pin==='1234'){ if(confirm('Yakin hapus semua Kas?')){ kasData=[]; renderKas(); } } }
function exportExcel(){ let f=getFilterKas(); let filtered=kasData.map((d,i)=>({...d, origIdx:i})).filter(d=>{ if(f.bln!=='all' && (d.tgl||'').split('-')[1]!==f.bln) return false; if(f.thn!=='all' && (d.tgl||'').split('-')[0]!==f.thn) return false; if(f.ket &&!(d.ket||'').toLowerCase().includes(f.ket)) return false; return true; }); let csv='Tgl,Jam,Ket,Masuk,Keluar,Saldo\n'; filtered.forEach(d=>{ let run=0; for(let j=0;j<=d.origIdx;j++){ run+=(parseInt(kasData[j].masuk)||0)-(parseInt(kasData[j].keluar)||0); } csv+=`${d.tgl},${d.jam},"${d.ket}",${d.masuk},${d.keluar},${run}\n`; }); let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`kas-tpq-${f.bln}-${f.thn}.csv`; a.click(); }
function rekapKas(){ let f=getFilterKas(); let filtered=kasData.filter(d=>{ if(f.bln!=='all' && (d.tgl||'').split('-')[1]!==f.bln) return false; if(f.thn!=='all' && (d.tgl||'').split('-')[0]!==f.thn) return false; if(f.ket &&!(d.ket||'').toLowerCase().includes(f.ket)) return false; return true; }); let masuk=filtered.reduce((s,d)=>s+(parseInt(d.masuk)||0),0); let keluar=filtered.reduce((s,d)=>s+(parseInt(d.keluar)||0),0); alert(`Rekap Filter ${f.bln!=='all'? 'Bln '+f.bln:''} ${f.thn!=='all'? 'Thn '+f.thn:''}:\nMasuk Rp ${masuk.toLocaleString('id-ID')}\nKeluar Rp ${keluar.toLocaleString('id-ID')}\nSaldo Rp ${(masuk-keluar).toLocaleString('id-ID')}\nJumlah ${filtered.length}`); }
async function simpanKasCloud(){ let url=getKasUrl(); if(!url){ alert('Isi kode dulu Pak'); return; } setKasStatus('Menyimpan...',false); try{ let r=await fetch(url,{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(kasData)}); if(r.ok) setKasStatus('Berhasil simpan Pak '+new Date().toLocaleTimeString(),true); }catch(e){ setKasStatus('Gagal Pak',false); } }
async function ambilKasCloud(){ let url=getKasUrl(); if(!url){ alert('Isi kode dulu'); return; } if(!confirm('Ambil dari langit?')) return; setKasStatus('Mengambil...',false); try{ let r=await fetch(url); let j=await r.json(); if(Array.isArray(j)){ kasData=j; renderKas(); setKasStatus('Berhasil ambil '+j.length,true); } }catch(e){ setKasStatus('Gagal',false); } }
let data=JSON.parse(localStorage.getItem('santriTPQ')||'[]'); let editIndex=-1;
let syncId=localStorage.getItem('tpq_npoint')||''; document.getElementById('syncId').value=syncId;
function getUrl(){ let id=document.getElementById('syncId').value.trim(); if(!id) return null; if(id.includes('npoint.io')) id=id.split('/').pop(); return 'https://api.npoint.io/'+id; }
function setStatus(m,ok){ document.getElementById('statusSync').innerText=m; document.getElementById('badgeSync').style.display=ok?'inline-block':'none'; }
function render(){ let tb=document.getElementById('tbody'); tb.innerHTML=''; data.forEach((d,i)=>{ tb.innerHTML+=`<tr><td>${i+1}</td><td>${d.nama}</td><td>${d.jk}</td><td>${d.usia}</td><td>${d.wali}</td><td>${d.hp}</td><td>${d.alamat}</td><td>${d.tgl}</td><td><button style="background:#ffc107;" onclick="editData(${i})">Edit</button> <button style="background:#dc3545; color:#fff;" onclick="hapusData(${i})">Hapus</button></td></tr>`; }); localStorage.setItem('santriTPQ', JSON.stringify(data)); renderKas(); }
async function simpanCloud(){ let url=getUrl(); if(!url){ alert('Isi kode'); return; } setStatus('Menyimpan...',false); try{ let r=await fetch(url,{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)}); if(r.ok) setStatus('Berhasil '+new Date().toLocaleTimeString(),true); }catch(e){ setStatus('Gagal',false);} }
async function ambilCloud(){ let url=getUrl(); if(!url){ alert('Isi kode'); return; } if(!confirm('Ambil?')) return; try{ let r=await fetch(url); let j=await r.json(); if(Array.isArray(j)){ data=j; render(); setStatus('Berhasil '+j.length,true);} }catch(e){ setStatus('Gagal',false);} }
function inputData(){ let nama=document.getElementById('nama').value.trim(); let jk=document.getElementById('jk').value; let usia=document.getElementById('usia').value; let wali=document.getElementById('wali').value; let hp=document.getElementById('hp').value; let alamat=document.getElementById('alamat').value; let tgl=document.getElementById('tgl').value||new Date().toISOString().split('T')[0]; if(!nama||!jk){ alert('Nama & L/P wajib'); return; } let obj={nama,jk,usia,wali,hp,alamat,tgl}; if(editIndex>=0){ data[editIndex]=obj; editIndex=-1; } else data.push(obj); document.getElementById('nama').value=''; document.getElementById('jk').value=''; document.getElementById('usia').value=''; document.getElementById('wali').value=''; document.getElementById('hp').value=''; document.getElementById('alamat').value=''; render(); }
function editData(i){ let d=data[i]; document.getElementById('nama').value=d.nama; document.getElementById('jk').value=d.jk; document.getElementById('usia').value=d.usia; document.getElementById('wali').value=d.wali; document.getElementById('hp').value=d.hp; document.getElementById('alamat').value=d.alamat; document.getElementById('tgl').value=d.tgl; editIndex=i; }
function hapusData(i){ if(confirm('Hapus '+data[i].nama+'?')){ data.splice(i,1); render(); } }
loadDark(); render(); renderKas();
let lastTab=localStorage.getItem('tpq_tab')||'kas'; showTab(lastTab);
</script>
</body>
</html>
